<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ledgerlens Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: engagement bar on top, ledger-tab rail on the left (top strip on phones), working canvas on the right. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #e4ebe8; --ink: #13201c; --muted: #56675f; --line: #cfd9d5;
  --accent: #17614f; --accent-ink: #ffffff; --accent-soft: #d6e8e1; --brass: #8f6b1f;
  --good: #1d7a4b; --good-soft: #dcefe4; --warn: #a86b12; --warn-soft: #f6ead3; --bad: #b0352c; --bad-soft: #f6dcd9;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #15201d; --surface-2: #1c2a26; --ink: #e3ece8; --muted: #92a69e; --line: #2a3b36;
  --accent: #52b796; --accent-ink: #08130f; --accent-soft: #1b3830; --brass: #d4a94e;
  --good: #4fc287; --good-soft: #173528; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #ec6c61; --bad-soft: #3e1d1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #15201d; --surface-2: #1c2a26; --ink: #e3ece8; --muted: #92a69e; --line: #2a3b36;
  --accent: #52b796; --accent-ink: #08130f; --accent-soft: #1b3830; --brass: #d4a94e;
  --good: #4fc287; --good-soft: #173528; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #ec6c61; --bad-soft: #3e1d1a; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.7rem; line-height: 1.15; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
.num, td.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* engagement bar */
.top { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; }
.brand span { color: var(--muted); font-size: 0.82rem; }
.engagement { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .field .lbl { font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; min-width: 0; }
.engagement input { width: 190px; max-width: 100%; }
.engagement input#thr { width: 120px; }
.langsw { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.langsw button { border: 0; background: none; padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.04em; color: var(--muted); }
.langsw button + button { border-left: 1px solid var(--line); }
.langsw button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 70px); }
nav.rail { border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.rail button { display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 4px; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 9px 10px; cursor: pointer; color: var(--muted); }
.rail button .k { font-family: var(--f-data); font-size: 0.75rem; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button[aria-selected=true] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail button[aria-selected=true] .k { color: var(--accent); }
.rail .sep { height: 1px; background: var(--line); margin: 10px 8px; }
.rail .present { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.rail .present:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }

main { padding-block: 26px 60px; padding-inline: 28px; min-width: 0; }
section.view { display: flex; flex-direction: column; gap: 22px; max-width: 1180px; }
.head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.head p { max-width: 68ch; color: var(--muted); margin-top: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel > h3 + * { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.chartbox { position: relative; height: 290px; }
.chartbox.tall { height: 340px; }
.note { font-size: 0.82rem; color: var(--muted); max-width: 75ch; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 13px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.stat { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.stat .v { font-family: var(--f-data); font-size: 1.32rem; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.stat.flag-good { box-shadow: inset 3px 0 0 var(--good); }
.stat.flag-warn { box-shadow: inset 3px 0 0 var(--warn); }
.stat.flag-bad { box-shadow: inset 3px 0 0 var(--bad); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--surface-2); color: var(--muted); }
.badge-sample { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--brass); border: 1px solid currentColor; border-radius: 999px; padding: 2px 9px; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.grp td { background: var(--bg); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
tr.total td { font-weight: 600; background: var(--surface-2); }
td input[type=number], td input[type=text] { width: 100%; min-width: 110px; padding: 5px 8px; }
td input[type=number] { text-align: right; font-family: var(--f-data); }
.scroll { max-height: 460px; overflow: auto; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* test cards */
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.test { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.test:hover { border-color: var(--accent); }
.test[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.test .t { font-weight: 600; }
.test .n { font-family: var(--f-data); font-size: 1.25rem; }
.test .d { font-size: 0.78rem; color: var(--muted); }

/* upload */
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: space-between; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { display: none; }
.mapping { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.mapping select { width: 100%; }

.finform td:first-child { white-space: nowrap; }

/* z-score scale */
.zscale { position: relative; height: 34px; margin-top: 14px; border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: 22fr 30fr 48fr; }
.zscale div { display: flex; align-items: flex-end; padding: 0 6px 3px; font-size: 0.7rem; font-weight: 600; }
.zscale .z1 { background: var(--bad-soft); color: var(--bad); }
.zscale .z2 { background: var(--warn-soft); color: var(--warn); }
.zscale .z3 { background: var(--good-soft); color: var(--good); }
.zmark { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
.zwrap { position: relative; }
.zticks { display: grid; grid-template-columns: 22fr 30fr 48fr; font-size: 0.72rem; color: var(--muted); font-family: var(--f-data); margin-top: 4px; }

/* board report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 30px 34px; display: flex; flex-direction: column; gap: 24px; }
.report header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.report h2 { font-size: 2rem; }
.overall { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r); }
.overall.good { background: var(--good-soft); } .overall.warn { background: var(--warn-soft); } .overall.bad { background: var(--bad-soft); }
.overall .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.overall.good .dot { background: var(--good); } .overall.warn .dot { background: var(--warn); } .overall.bad .dot { background: var(--bad); }
.overall p { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.35; }
.findings { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.findings li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.findings li:last-child { border-bottom: 0; }
.findings .area { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.recs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.recs li::marker { font-family: var(--f-data); color: var(--accent); }

/* presentation */
.deck { position: fixed; inset: 0; z-index: 50; background: #0b1110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.slide { --s-bg: #fbfcfb; --s-ink: #12201c; --s-muted: #5a6a63; --s-line: #d3ddd9; background: var(--s-bg); color: var(--s-ink); width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; border-radius: 4px; padding: 4.2% 5%; display: flex; flex-direction: column; gap: 3%; overflow: hidden; container-type: inline-size; }
.slide .s-eyebrow { font-size: 1.5cqw; letter-spacing: 0.1em; text-transform: uppercase; color: #17614f; font-weight: 600; }
.slide h1 { font-size: 4.6cqw; line-height: 1.08; color: var(--s-ink); }
.slide h2 { font-size: 3.1cqw; line-height: 1.15; color: var(--s-ink); }
.slide p, .slide li { font-size: 1.75cqw; line-height: 1.4; }
.slide .s-body { flex: 1; min-height: 0; display: grid; gap: 3cqw; }
.slide .s-two { grid-template-columns: 1fr 1fr; }
.slide .s-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqw; }
.slide .s-kpi { border-top: 3px solid var(--s-line); padding-top: 1cqw; }
.slide .s-kpi.good { border-color: #1d7a4b; } .slide .s-kpi.warn { border-color: #a86b12; } .slide .s-kpi.bad { border-color: #b0352c; }
.slide .s-kpi .l { font-size: 1.3cqw; color: var(--s-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.slide .s-kpi .v { font-family: var(--f-data); font-size: 3.2cqw; margin-top: 0.4cqw; }
.slide .s-kpi .s { font-size: 1.3cqw; color: var(--s-muted); }
.slide .s-chart { position: relative; min-height: 0; }
.slide ul { margin: 0; padding-left: 2.2cqw; display: flex; flex-direction: column; gap: 1.1cqw; }
.slide table { font-size: 1.5cqw; }
.slide th { background: #eef2f0; color: #5a6a63; }
.slide td { border-color: #d3ddd9; }
.slide .s-foot { display: flex; justify-content: space-between; font-size: 1.15cqw; color: var(--s-muted); border-top: 1px solid var(--s-line); padding-top: 1cqw; }
.slide .s-title { justify-content: center; }
.slide .s-rule { width: 9cqw; height: 0.5cqw; background: #17614f; }
.deckbar { display: flex; gap: 10px; align-items: center; color: #c9d6d1; font-family: var(--f-data); font-size: 0.85rem; flex-wrap: wrap; justify-content: center; }
.deckbar button { background: #1c2a26; color: #e3ece8; border: 1px solid #2f413b; border-radius: var(--r); padding: 6px 13px; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: 0.88rem; z-index: 60; max-width: calc(100% - 32px); }

/* DuPont */
.dpeq { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; margin-top: 12px; }
.dpterm { flex: 1 1 150px; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--bg); }
.dpterm.res { background: var(--accent-soft); border-color: var(--accent); }
.dpterm .l { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.dpterm .v { font-family: var(--f-data); font-size: 1.4rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.dpterm .s { font-family: var(--f-data); font-size: 0.8rem; color: var(--muted); }
.dpop { align-self: center; font-family: var(--f-data); font-size: 1.3rem; color: var(--muted); }
tr.optrow td { background: var(--bg); font-size: 0.78rem; color: var(--muted); font-weight: 600; }

/* toolkit */
.kitbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.kitbar input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; flex: 1 1 220px; min-width: 0; }
.kitbar select { background: var(--surface); }
.kitch { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.kitch .code { font-family: var(--f-data); font-size: 0.78rem; color: var(--accent); font-weight: 500; }
.calcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; align-items: start; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; scroll-margin-top: 80px; }
.calc.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.calc header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.calc h3 { font-size: 1.02rem; }
.calc .reset { background: none; border: 1px solid var(--line); border-radius: var(--r); font-size: 0.75rem; padding: 3px 9px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.calc .reset:hover { border-color: var(--accent); color: var(--ink); }
.cin { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 10px; }
.cin .ci { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 0.76rem; color: var(--muted); }
.cin .ci.wide { grid-column: 1 / -1; }
.cin .iw { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.cin .iw:focus-within { border-color: var(--accent); }
.cin input { border: 0; background: none; padding: 6px 8px; width: 100%; min-width: 0; font-family: var(--f-data); font-size: 0.88rem; color: var(--ink); }
.cin input:focus { outline: none; }
.cin .u { padding-right: 8px; font-family: var(--f-data); font-size: 0.8rem; color: var(--muted); }
.cout { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cout .co { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.cout .co:last-child { border-bottom: 0; }
.cout dt { min-width: 0; font-size: 0.86rem; }
.cout dt small { display: block; font-family: var(--f-data); font-size: 0.72rem; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
.cout dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
.calc .cnote { font-size: 0.78rem; color: var(--muted); }
.libtable td.f { font-family: var(--f-data); font-size: 0.8rem; }
.libtable .open { background: none; border: 1px solid var(--line); border-radius: var(--r); padding: 3px 9px; cursor: pointer; font-size: 0.78rem; white-space: nowrap; }
.libtable .open:hover { border-color: var(--accent); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .rail button { grid-template-columns: auto auto; white-space: nowrap; }
  .rail .sep { display: none; }
  main { padding-inline: 16px; }
  .top { padding: 12px 16px; }
  .report { padding: 20px 18px; }
  .findings li { grid-template-columns: 1fr; gap: 2px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .rail button, .test, .btn, .langsw button { transition: background .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="top">
  <div class="brand"><b>Ledgerlens</b><span data-i18n="brandSub"></span></div>
  <div class="engagement">
    <div class="field"><label for="client" data-i18n="lblClient"></label><input type="text" id="client"></div>
    <div class="field"><label for="period" data-i18n="lblPeriod"></label><input type="text" id="period"></div>
    <div class="field"><label for="thr" data-i18n="lblThr"></label><input type="number" id="thr" value="10000" min="0" step="500"></div>
    <div class="field"><span class="lbl" id="langLbl" data-i18n="lblLang"></span>
      <div class="langsw" role="group" aria-labelledby="langLbl"><button type="button" data-lang="el" lang="el">ΕΛ</button><button type="button" data-lang="en" lang="en">EN</button></div>
    </div>

<script>
/* ===== Ledgerlens engine: pure analytics, no DOM ===== */
var LL = (function () {
  'use strict';

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function normal(r) {
    var u = 1 - r(), v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  var r2 = function (x) { return Math.round(x * 100) / 100; };

  /* ---------- parsing ---------- */
  function strip(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) {
        var d = new Date(Math.round((v - 25569) * 86400000));
        return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      }
      return null;
    }
    var s = String(v).trim(), m;
    m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(parseFloat(s));
    return null;
  }
  function parseAmount(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[\s €$£]|EUR/gi, '');
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    var c = s.lastIndexOf(','), d = s.lastIndexOf('.');
    if (c > -1 && d > -1) {
      if (c > d) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (c > -1) {
      s = /,\d{1,2}$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (d > -1 && /^-?\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    var n = parseFloat(s);
    if (!isFinite(n)) return null;
    return neg ? -Math.abs(n) : n;
  }

  var KEYS = {
    date: ['date', 'ημερομην', 'ημ/νια', 'ημνια', 'posting', 'trans date', 'value date', 'ημ.'],
    amount: ['amount', 'ποσο', 'αξια', 'value', 'total', 'συνολο', 'net', 'debit', 'χρεωση', 'πληρωμ'],
    party: ['vendor', 'supplier', 'προμηθευτ', 'πελατ', 'customer', 'party', 'payee', 'δικαιουχ', 'επωνυμια', 'name', 'ονομα'],
    account: ['account', 'λογαριασμ', 'category', 'κατηγορ', 'gl', 'cost centre', 'κεντρο κοστους', 'expense'],
    doc: ['invoice', 'τιμολογ', 'doc', 'παραστατ', 'reference', 'ref', 'αρ.', 'αριθμ', 'number', 'no']
  };
  function detectColumns(headers) {
    var map = { date: -1, amount: -1, party: -1, account: -1, doc: -1 };
    var used = {};
    var h = headers.map(strip);
    ['date', 'amount', 'party', 'account', 'doc'].forEach(function (f) {
      for (var k = 0; k < KEYS[f].length && map[f] < 0; k++) {
        for (var i = 0; i < h.length; i++) {
          if (!used[i] && h[i].indexOf(strip(KEYS[f][k])) > -1) { map[f] = i; used[i] = 1; break; }
        }
      }
    });
    return map;
  }
  function buildRows(matrix, map) {
    var out = [];
    for (var i = 0; i < matrix.length; i++) {
      var r = matrix[i] || [];
      var amt = map.amount > -1 ? parseAmount(r[map.amount]) : null;
      var dt = map.date > -1 ? parseDate(r[map.date]) : null;
      if (amt == null && dt == null) continue;
      out.push({
        i: out.length,
        date: dt,
        amount: amt,
        party: map.party > -1 && r[map.party] != null ? String(r[map.party]).trim() : '',
        account: map.account > -1 && r[map.account] != null ? String(r[map.account]).trim() : '',
        doc: map.doc > -1 && r[map.doc] != null ? String(r[map.doc]).trim() : ''
      });
    }
    return out;
  }

  /* ---------- sample ledger (example data, clearly labelled in the UI) ---------- */
  function sampleLedger() {
    var r = rng(20261012);
    var V = [
      ['Άλφα Προμήθειες Λτδ', 'Αναλώσιμα', 450, 9], ['CyTech Solutions Ltd', 'Υπηρεσίες IT', 2800, 4],
      ['Λεμεσός Logistics', 'Μεταφορικά', 1200, 6], ['Ορθοδόξου & Υιοί Λτδ', 'Συντήρηση κτιρίων', 3500, 3],
      ['Kypros Office Supply', 'Αναλώσιμα', 180, 10], ['Μεσόγειος Ενέργεια', 'Ενέργεια', 2200, 4],
      ['Pafos Print House', 'Μάρκετινγκ', 650, 5], ['Τρόοδος Catering', 'Τροφοδοσία', 380, 7],
      ['Nicosia Legal Partners', 'Νομικά', 4200, 2], ['Larnaca Freight Co', 'Μεταφορικά', 1900, 5],
      ['Αθηαίνου Συντηρήσεις', 'Συντήρηση κτιρίων', 900, 6], ['Blue Wave Marketing', 'Μάρκετινγκ', 3100, 3],
      ['Akamas Insurance Brokers', 'Ασφάλιστρα', 5200, 2], ['Οίκος Καθαρισμών Λτδ', 'Καθαριότητα', 520, 6],
      ['Synergy IT Services', 'Υπηρεσίες IT', 1500, 5]
    ];
    var wsum = V.reduce(function (a, v) { return a + v[3]; }, 0);
    function pick() { var x = r() * wsum; for (var k = 0; k < V.length; k++) { x -= V[k][3]; if (x <= 0) return V[k]; } return V[V.length - 1]; }
    var season = [0.95, 0.9, 1, 1, 1.02, 1, 0.98, 0.8, 1, 1.05, 1.08, 1.2];
    var rows = [], seq = 41000;
    function weekday(y, m) {
      var dim = new Date(y, m + 1, 0).getDate();
      var d = new Date(y, m, 1 + Math.floor(r() * dim));
      if (d.getDay() === 6) d.setDate(d.getDate() - 1);
      if (d.getDay() === 0) d.setDate(d.getDate() + 1);
      if (d.getMonth() !== m) d = new Date(y, m, d.getMonth() > m ? dim - 2 : 3);
      return d;
    }
    for (var mi = 0; mi < 21; mi++) {
      var y = 2025 + Math.floor(mi / 12), m = mi % 12;
      var n = Math.round(70 * (1 + 0.022 * mi) * season[m] * (0.95 + r() * 0.1));
      for (var j = 0; j < n; j++) {
        var v = pick();
        var a = r2(v[2] * Math.exp(0.6 * normal(r)));
        if (a < 12) a = r2(12 + r() * 30);
        if (a % 1000 === 0) a += 7.35;
        if (a >= 9500 && a < 10000) a = r2(a * 1.07);
        rows.push({ date: weekday(y, m), amount: a, party: v[0], account: v[1], doc: 'INV-' + (seq++) });
      }
    }
    rows.sort(function (a, b) { return a.date - b.date; });
    // planted exceptions so every test has something to show
    var pickRow = function () { return rows[Math.floor(r() * rows.length)]; };
    for (var k = 0; k < 8; k++) {
      var s = pickRow(), d2 = new Date(s.date); d2.setDate(d2.getDate() + 1 + Math.floor(r() * 9));
      if (d2.getDay() === 6) d2.setDate(d2.getDate() + 2); if (d2.getDay() === 0) d2.setDate(d2.getDate() + 1);
      rows.push({ date: d2, amount: s.amount, party: s.party, account: s.account, doc: k < 3 ? s.doc : 'INV-' + (seq++) });
    }
    for (k = 0; k < 11; k++) {
      var w = pickRow(), d3 = new Date(w.date); d3.setDate(d3.getDate() + (6 - d3.getDay()) + (k % 2));
      rows.push({ date: d3, amount: r2(w.amount * (0.8 + r() * 0.4)), party: w.party, account: w.account, doc: 'INV-' + (seq++) });
    }
    var big = [V[3], V[8], V[12], V[1], V[11]];
    for (k = 0; k < 9; k++) {
      var b = big[k % big.length], d4 = pickRow().date;
      rows.push({ date: new Date(d4), amount: r2(9850 + r() * 145), party: b[0], account: b[1], doc: 'INV-' + (seq++) });
    }
    var rounds = [5000, 15000, 10000, 3000, 20000, 8000];
    for (k = 0; k < 6; k++) {
      var c = big[k % big.length];
      rows.push({ date: new Date(pickRow().date), amount: rounds[k], party: c[0], account: c[1], doc: 'INV-' + (seq++) });
    }
    var outl = [V[0], V[4], V[7], V[13]];
    for (k = 0; k < 4; k++) {
      rows.push({ date: new Date(pickRow().date), amount: r2(outl[k][2] * (19 + r() * 6)), party: outl[k][0], account: outl[k][1], doc: 'INV-' + (seq++) });
    }
    for (k = 0; k < 14; k++) {
      var cn = pickRow();
      rows.push({ date: new Date(cn.date), amount: -r2(cn.amount * (0.1 + r() * 0.3)), party: cn.party, account: cn.account, doc: 'CN-' + (seq++) });
    }
    rows.sort(function (a, b) { return a.date - b.date; });
    rows.forEach(function (x, i) { x.i = i; });
    return rows;
  }

  /* ---------- helpers ---------- */
  function ym(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function mean(a) { return a.reduce(function (s, x) { return s + x; }, 0) / (a.length || 1); }
  function sd(a) { var m = mean(a); return Math.sqrt(a.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / Math.max(1, a.length - 1)); }

  function profile(rows) {
    var dates = rows.filter(function (x) { return x.date; }).map(function (x) { return x.date; });
    var amts = rows.filter(function (x) { return x.amount != null; });
    var parties = {};
    rows.forEach(function (x) { if (x.party) parties[x.party] = 1; });
    return {
      n: rows.length,
      missDate: rows.length - dates.length,
      missAmount: rows.length - amts.length,
      missParty: rows.filter(function (x) { return !x.party; }).length,
      negatives: amts.filter(function (x) { return x.amount < 0; }).length,
      total: amts.reduce(function (s, x) { return s + x.amount; }, 0),
      gross: amts.reduce(function (s, x) { return s + Math.max(0, x.amount); }, 0),
      from: dates.length ? new Date(Math.min.apply(null, dates)) : null,
      to: dates.length ? new Date(Math.max.apply(null, dates)) : null,
      parties: Object.keys(parties).length
    };
  }

  /* ---------- audit tests ---------- */
  var BENF = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return Math.log10(1 + 1 / d); });
  function benford(rows) {
    var cnt = [0, 0, 0, 0, 0, 0, 0, 0, 0], n = 0;
    rows.forEach(function (x) {
      if (x.amount == null) return;
      var a = Math.abs(x.amount);
      if (a < 10) return;
      var d = +String(Math.floor(a)).charAt(0);
      cnt[d - 1]++; n++;
    });
    var obs = cnt.map(function (c) { return n ? c / n : 0; });
    var chi = 0, mad = 0;
    for (var k = 0; k < 9; k++) {
      var e = BENF[k] * n;
      if (e > 0) chi += (cnt[k] - e) * (cnt[k] - e) / e;
      mad += Math.abs(obs[k] - BENF[k]);
    }
    mad /= 9;
    var verdict = mad < 0.006 ? 'Στενή συμμόρφωση' : mad < 0.012 ? 'Αποδεκτή συμμόρφωση' : mad < 0.015 ? 'Οριακά αποδεκτή' : 'Μη συμμόρφωση';
    var level = mad < 0.012 ? 'good' : mad < 0.015 ? 'warn' : 'bad';
    return { n: n, counts: cnt, obs: obs, exp: BENF.slice(), chi: chi, chiCrit: 15.507, mad: mad, verdict: verdict, level: level };
  }

  function auditTests(rows, threshold) {
    var flags = {};
    function flag(row, test, note) {
      if (!flags[row.i]) flags[row.i] = { row: row, tests: {} };
      if (!flags[row.i].tests[test]) flags[row.i].tests[test] = note || true;
    }
    var pos = rows.filter(function (x) { return x.amount != null && x.amount > 0; });
    var res = { dup: { n: 0, value: 0, recover: 0 }, wkd: { n: 0, value: 0 }, thr: { n: 0, value: 0 }, rnd: { n: 0, value: 0 }, out: { n: 0, value: 0 } };

    // duplicates: same party and amount within 30 days, or same party and document number
    var g = {};

    pos.forEach(function (x) { if (x.doc) { var k = x.party + '|' + x.doc; (gd[k] = gd[k] || []).push(x); } });
    Object.keys(gd).forEach(function (k) {

  function irr(cf) {

    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
    for (var i = 0; i < 200; i++) { var mid = (lo + hi) / 2, fm = npv(mid, cf); if (Math.abs(fm) < 1e-9) return mid; if (flo * fm < 0) { hi = mid; } else { lo = mid; flo = fm; } }
    return (lo + hi) / 2;

    var cum = 0;
    for (var t = 0; t < flows.length; t++) {
      var prev = cum; cum += flows[t];

    { id: 'nrv', ch: '600-1', title: L('Αποτίμηση αποθεμάτων (ΔΛΠ 2)', 'Inventory valuation (IAS 2)'),

      outputs: [[L('Καθαρή ρευστοποιήσιμη αξία', 'Net realisable value'), function (v) { return v.sp - v.cc; }, 'eur', L('Τιμή πώλησης − Κόστος ολοκλήρωσης/πώλησης', 'Selling price − Costs to complete and sell')],
        [L('Αξία στον ισολογισμό', 'Carrying amount'), function (v) { return Math.min(v.c, v.sp - v.cc); }, 'eur', L('Χαμηλότερη από κόστος και ΚΡΑ', 'Lower of cost and NRV')],
        [L('Απομείωση', 'Write-down'), function (v) { return Math.max(0, v.c - (v.sp - v.cc)); }, 'eur', L('Κόστος − ΚΡΑ, αν θετικό', 'Cost − NRV, if positive')]] },
    { id: 'wc', ch: '600-1', title: L('Κεφάλαιο κίνησης και ρευστότητα', 'Working capital and liquidity'),
      inputs: [['ca', L('Κυκλοφορούν ενεργητικό', 'Current assets'), 120000, '€'], ['inv', L('εκ των οποίων αποθέματα', 'of which inventory'), 40000, '€'], ['cl', L('Βραχυπρόθεσμες υποχρεώσεις', 'Current liabilities'), 80000, '€']],
      outputs: [[L('Κεφάλαιο κίνησης', 'Working capital'), function (v) { return v.ca - v.cl; }, 'eur', L('Κυκλοφορούν − Βραχυπρόθεσμες', 'Current assets − Current liabilities')],
        [L('Τρέχουσα ρευστότητα', 'Current ratio'), function (v) { return v.ca / v.cl; }, 'x', L('Κυκλοφορούν / Βραχυπρόθεσμες', 'CA / CL')],
        [L('Άμεση ρευστότητα', 'Quick ratio'), function (v) { return (v.ca - v.inv) / v.cl; }, 'x', L('(Κυκλοφορούν − Αποθέματα) / Βραχυπρόθεσμες', '(CA − Inventory) / CL')]],
      note: L('Άσκηση 2: 1,5 και 1,0.', 'Exercise 2: 1.5 and 1.0.') },
    { id: 'ratios', ch: '600-2', title: L('Ανάλυση δεικτών και DuPont', 'Ratio analysis and DuPont'),
      inputs: [['rev', L('Κύκλος εργασιών', 'Revenue'), 1000000, '€'], ['cos', L('Κόστος πωλήσεων', 'Cost of sales'), 600000, '€'], ['ebit', 'EBIT', 150000, '€'], ['int', L('Τόκοι', 'Interest'), 20000, '€'], ['np', L('Καθαρό κέρδος', 'Net profit'), 100000, '€'], ['po', L('Κέρδος για κοινούς μετόχους', 'Profit to ordinary shareholders'), 95000, '€'], ['eq', L('Ίδια κεφάλαια', 'Equity'), 800000, '€'], ['ncl', L('Μακροπρόθεσμες υποχρεώσεις', 'Non-current liabilities'), 300000, '€'], ['debt', L('Δανεισμός', 'Debt'), 300000, '€'], ['ta', L('Σύνολο ενεργητικού', 'Total assets'), 1350000, '€'], ['ca', L('Κυκλοφορούν ενεργητικό', 'Current assets'), 400000, '€'], ['cl', L('Βραχυπρόθεσμες υποχρεώσεις', 'Current liabilities'), 250000, '€'], ['inv', L('Αποθέματα', 'Inventory'), 120000, '€'], ['rec', L('Χρεώστες', 'Receivables'), 150000, '€'], ['pay', L('Πιστωτές', 'Payables'), 90000, '€'], ['sh', L('Αριθμός μετοχών', 'No. of shares'), 500000, 'n'], ['px', L('Τιμή μετοχής', 'Share price'), 2.5, '€']],
      outputs: [[L('Μικτό περιθώριο', 'Gross margin'), function (v) { return (v.rev - v.cos) / v.rev; }, 'pct', L('Μικτό κέρδος / Πωλήσεις', 'Gross profit / Revenue')],
        [L('Λειτουργικό περιθώριο (EBIT)', 'Operating (EBIT) margin'), function (v) { return v.ebit / v.rev; }, 'pct', 'EBIT / Revenue'],
        ['ROCE', function (v) { return v.ebit / (v.eq + v.ncl); }, 'pct', L('EBIT / (Ίδια κεφάλαια + Μακροπρόθεσμες)', 'EBIT / (Equity + Non-current liabilities)')],
        ['ROE', function (v) { return v.np / v.eq; }, 'pct', L('Καθαρό κέρδος / Ίδια κεφάλαια', 'Net profit / Equity')],
        [L('Τρέχουσα ρευστότητα', 'Current ratio'), function (v) { return v.ca / v.cl; }, 'x', 'CA / CL'],
        [L('Άμεση ρευστότητα', 'Quick (acid test)'), function (v) { return (v.ca - v.inv) / v.cl; }, 'x', '(CA − Inventory) / CL'],
        [L('Μέρες είσπραξης', 'Receivable days'), function (v) { return v.rec / v.rev * 365; }, 'days', L('Χρεώστες / Πωλήσεις × 365', 'Receivables / Revenue × 365')],
        [L('Μέρες πληρωμής', 'Payable days'), function (v) { return v.pay / v.cos * 365; }, 'days', L('Πιστωτές / Κόστος πωλήσεων × 365', 'Payables / Cost of sales × 365')],
        [L('Μέρες αποθέματος', 'Inventory days'), function (v) { return v.inv / v.cos * 365; }, 'days', L('Αποθέματα / Κόστος πωλήσεων × 365', 'Inventory / Cost of sales × 365')],
        [L('Ταμειακός λειτουργικός κύκλος', 'Cash operating cycle'), function (v) { return (v.inv / v.cos + v.rec / v.rev - v.pay / v.cos) * 365; }, 'days', L('Αποθ. + Είσπρ. − Πληρωμής (μέρες)', 'Inventory + Receivable − Payable days')],
        ['Gearing', function (v) { return v.debt / (v.debt + v.eq); }, 'pct', L('Δανεισμός / (Δανεισμός + Ίδια κεφάλαια)', 'Debt / (Debt + Equity)')],
        [L('Κάλυψη τόκων', 'Interest cover'), function (v) { return v.ebit / v.int; }, 'x', 'EBIT / Interest'],
        ['EPS', function (v) { return v.po / v.sh; }, 'eur', L('Κέρδος κοινών μετόχων / Αρ. μετοχών', 'Profit to ordinary shareholders / No. of shares')],
        ['P/E', function (v) { return v.px / (v.po / v.sh); }, 'x', L('Τιμή μετοχής / EPS', 'Share price / EPS')],
        [L('DuPont: καθαρό περιθώριο', 'DuPont: net margin'), function (v) { return v.np / v.rev; }, 'pct', L('Καθαρό κέρδος / Πωλήσεις', 'Net profit / Revenue')],
        [L('DuPont: κυκλοφοριακή ταχύτητα', 'DuPont: asset turnover'), function (v) { return v.rev / v.ta; }, 'x', L('Πωλήσεις / Σύνολο ενεργητικού', 'Revenue / Total assets')],
        [L('DuPont: πολλαπλασιαστής ΙΚ', 'DuPont: equity multiplier'), function (v) { return v.ta / v.eq; }, 'x', L('Σύνολο ενεργητικού / Ίδια κεφάλαια', 'Total assets / Equity')],
        [L('ROE κατά DuPont', 'ROE (DuPont)'), function (v) { return (v.np / v.rev) * (v.rev / v.ta) * (v.ta / v.eq); }, 'pct', L('Περιθώριο × Ταχύτητα × Πολλαπλασιαστής', 'Margin × Turnover × Multiplier')]],
      note: L('Για τα μεγέθη ενός πελάτη με δύο χρήσεις, χρησιμοποίησε την ενότητα «Οικονομική υγεία».', 'For a client\'s figures across two years, use the Financial health section.') },
    { id: 'cvp', ch: '600-3', title: L('Ανάλυση κόστους-όγκου-κέρδους (CVP)', 'Cost-volume-profit (CVP)'),
      inputs: [['p', L('Τιμή πώλησης ανά μονάδα', 'Selling price per unit'), 12, '€'], ['vc', L('Μεταβλητό κόστος ανά μονάδα', 'Variable cost per unit'), 4, '€'], ['F', L('Σταθερά κόστη', 'Fixed costs'), 4000, '€'], ['TP', L('Στόχος κέρδους', 'Target profit'), 2000, '€'], ['BU', L('Προϋπολογισμένες πωλήσεις (μονάδες)', 'Budgeted sales (units)'), 800, 'n']],
      outputs: [[L('Συνεισφορά ανά μονάδα', 'Contribution per unit'), function (v) { return v.p - v.vc; }, 'eur', L('Τιμή − Μεταβλητό κόστος', 'Price − Variable cost')],
        [L('Λόγος C/S', 'C/S ratio'), function (v) { return (v.p - v.vc) / v.p; }, 'pct', L('Συνεισφορά / Πωλήσεις', 'Contribution / Sales')],
        [L('Νεκρό σημείο (μονάδες)', 'Break-even (units)'), function (v) { return v.F / (v.p - v.vc); }, 'n', L('Σταθερά / Συνεισφορά ανά μονάδα', 'Fixed costs / Contribution per unit')],
        [L('Νεκρό σημείο (€)', 'Break-even (€)'), function (v) { return v.F / ((v.p - v.vc) / v.p); }, 'eur', L('Σταθερά / Λόγος C/S', 'Fixed costs / C/S ratio')],
        [L('Μονάδες για στόχο κέρδους', 'Units for target profit'), function (v) { return (v.F + v.TP) / (v.p - v.vc); }, 'n', L('(Σταθερά + Στόχος) / Συνεισφορά ανά μονάδα', '(Fixed costs + Target profit) / Contribution per unit')],
        [L('Περιθώριο ασφαλείας', 'Margin of safety'), function (v) { return (v.BU - v.F / (v.p - v.vc)) / v.BU; }, 'pct', L('(Προϋπ. − Νεκρό σημείο) / Προϋπ.', '(Budgeted − Break-even) / Budgeted')],
        [L('Κέρδος στις προϋπολογισμένες πωλήσεις', 'Profit at budgeted sales'), function (v) { return v.BU * (v.p - v.vc) - v.F; }, 'eur', L('Μονάδες × Συνεισφορά − Σταθερά', 'Units × Contribution − Fixed costs')]],
      note: L('Παράδειγμα πίτσας: νεκρό σημείο 500 μονάδες / 6.000 €, 750 μονάδες για τον στόχο, περιθώριο ασφαλείας 37,5%.', 'Pizza example: break-even 500 units / €6,000, 750 units for target, margin of safety 37.5%.') },
    { id: 'highlow', ch: '600-3', title: L('Ημιμεταβλητό κόστος: μέθοδος high-low', 'Semi-variable cost: high-low method'),
      inputs: [['uh', L('Μονάδες στη μέγιστη δραστηριότητα', 'Units at highest activity'), 1200, 'n'], ['ch', L('Κόστος στη μέγιστη', 'Cost at highest'), 8000, '€'], ['ul', L('Μονάδες στην ελάχιστη', 'Units at lowest activity'), 400, 'n'], ['cl', L('Κόστος στην ελάχιστη', 'Cost at lowest'), 4000, '€'], ['fx', L('Προβλεπόμενη δραστηριότητα', 'Forecast activity'), 1000, 'n']],
      outputs: [[L('Μεταβλητό κόστος ανά μονάδα (b)', 'Variable cost per unit (b)'), function (v) { return (v.ch - v.cl) / (v.uh - v.ul); }, 'eur', L('(Κόστος high − low) / (Μονάδες high − low)', '(Cost high − Cost low) / (Units high − Units low)')],
        [L('Σταθερό κόστος (a)', 'Fixed cost (a)'), function (v) { return v.ch - (v.ch - v.cl) / (v.uh - v.ul) * v.uh; }, 'eur', L('Κόστος − b × Μονάδες', 'Total cost − b × Units')],
        [L('Προβλεπόμενο συνολικό κόστος', 'Forecast total cost'), function (v) { var b = (v.ch - v.cl) / (v.uh - v.ul); return v.ch - b * v.uh + b * v.fx; }, 'eur', 'y = a + b·x']] },
    { id: 'regr', ch: '600-3', title: L('Ημιμεταβλητό κόστος: γραμμική παλινδρόμηση', 'Semi-variable cost: linear regression'),
      inputs: [['x', L('Μονάδες ανά μήνα', 'Units per month'), '400; 600; 800; 900; 1000; 1200', 'list'], ['y', L('Κόστος ανά μήνα', 'Cost per month'), '4000; 5100; 5900; 6600; 7100; 8000', 'list']],
      outputs: [[L('b: μεταβλητό κόστος ανά μονάδα', 'b: variable cost per unit'), function (v) { return regress(v.x, v.y).b; }, 'eur', 'SLOPE(cost, units)'],
        [L('a: σταθερό κόστος', 'a: fixed cost'), function (v) { return regress(v.x, v.y).a; }, 'eur', 'INTERCEPT(cost, units)'],
        ['R²', function (v) { return regress(v.x, v.y).r2; }, 'n4', L('Κοντά στο 1 = καλή προσαρμογή', 'Close to 1 = good fit')]],
      note: L('Ισοδύναμο του R: lm(cost ~ units).', 'Equivalent to R: lm(cost ~ units).') },
    { id: 'absorb', ch: '600-4', title: L('Πλήρης vs οριακή κοστολόγηση', 'Absorption vs marginal costing'),
      inputs: [['pr', L('Παραγωγή (μονάδες)', 'Production (units)'), 1000, 'n'], ['sa', L('Πωλήσεις (μονάδες)', 'Sales (units)'), 800, 'n'], ['foh', L('Σταθερά γενικά ανά μονάδα', 'Fixed overhead per unit'), 10, '€']],
      outputs: [[L('Μεταβολή αποθέματος (μονάδες)', 'Change in inventory (units)'), function (v) { return v.pr - v.sa; }, 'n', L('Παραγωγή − Πωλήσεις', 'Production − Sales')],
        [L('Δ κέρδους (πλήρης − οριακή)', 'Δ profit (absorption − marginal)'), function (v) { return (v.pr - v.sa) * v.foh; }, 'eur', L('Δ αποθέματος × Σταθερά γενικά ανά μονάδα', 'Δ inventory × Fixed overhead per unit')],
        [L('Μεγαλύτερο κέρδος', 'Higher profit'), function (v) { var d = v.pr - v.sa; return d > 0 ? ['absorption', 'info'] : d < 0 ? ['marginal', 'info'] : ['same', 'info']; }, 'dec', L('Παραγωγή > πωλήσεις → πλήρης', 'Production > sales → absorption')]],
      note: L('Άσκηση 4: η πλήρης δίνει 2.000 € περισσότερο.', 'Exercise 4: absorption is €2,000 higher.') },
    { id: 'oar', ch: '600-4', title: L('Συντελεστής απορρόφησης γενικών (OAR)', 'Overhead absorption rate (OAR)'),
      inputs: [['bo', L('Προϋπολογισμένα γενικά', 'Budgeted overheads'), 100000, '€'], ['ba', L('Προϋπολογισμένη δραστηριότητα (ώρες)', 'Budgeted activity (hours)'), 20000, 'n'], ['aa', L('Πραγματική δραστηριότητα (ώρες)', 'Actual activity (hours)'), 21000, 'n'], ['ao', L('Πραγματικά γενικά', 'Actual overheads'), 103000, '€']],
      outputs: [['OAR', function (v) { return v.bo / v.ba; }, 'eur', L('Προϋπ. γενικά / Προϋπ. δραστηριότητα', 'Budgeted overheads / Budgeted activity')],
        [L('Απορροφημένα γενικά', 'Overheads absorbed'), function (v) { return v.bo / v.ba * v.aa; }, 'eur', L('OAR × Πραγματική δραστηριότητα', 'OAR × Actual activity')],
        [L('Υπερ/(υπο)απορρόφηση', 'Over/(under) absorption'), function (v) { return v.bo / v.ba * v.aa - v.ao; }, 'oa', L('Απορροφημένα − Πραγματικά', 'Absorbed − Actual')]] },
    { id: 'abc', ch: '600-4', title: L('Κοστολόγηση βάσει δραστηριοτήτων (ABC)', 'Activity-based costing (ABC)'),
      inputs: [['pool', L('Κόστος δεξαμενής', 'Cost pool'), 30000, '€'], ['dr', L('Σύνολο οδηγών κόστους', 'Total cost drivers'), 60, 'n'], ['use', L('Οδηγοί που καταναλώνει το προϊόν', 'Drivers used by product'), 20, 'n']],
      outputs: [[L('Κόστος ανά οδηγό', 'Cost per driver'), function (v) { return v.pool / v.dr; }, 'eur', L('Δεξαμενή / Σύνολο οδηγών', 'Cost pool / Total drivers')],
        [L('Χρέωση στο προϊόν', 'Charge to product'), function (v) { return v.pool / v.dr * v.use; }, 'eur', L('Κόστος ανά οδηγό × Οδηγοί', 'Cost per driver × Drivers consumed')]],
      note: L('Παράδειγμα: setups 30.000 € / 60 = 500 € ανά setup.', 'Example: setups €30,000 / 60 = €500 per setup.') },
    { id: 'target', ch: '600-4', title: L('Κόστος-στόχος', 'Target costing'),
      inputs: [['mp', L('Τιμή αγοράς', 'Market price'), 100, '€'], ['dp', L('Επιθυμητό κέρδος ανά μονάδα', 'Desired profit per unit'), 25, '€']],
      outputs: [[L('Κόστος-στόχος', 'Target cost'), function (v) { return v.mp - v.dp; }, 'eur', L('Τιμή αγοράς − Επιθυμητό κέρδος', 'Market price − Desired profit')]] },
    { id: 'prodBudget', ch: '600-5', title: L('Προϋπολογισμός παραγωγής', 'Production budget'),
      inputs: [['s', L('Προϋπολογισμένες πωλήσεις (μονάδες)', 'Budgeted sales (units)'), 10000, 'n'], ['cl', L('Τελικό απόθεμα (μονάδες)', 'Closing inventory (units)'), 1500, 'n'], ['op', L('Αρχικό απόθεμα (μονάδες)', 'Opening inventory (units)'), 1000, 'n']],
      outputs: [[L('Παραγωγή (μονάδες)', 'Production (units)'), function (v) { return v.s + v.cl - v.op; }, 'n', L('Πωλήσεις + Τελικό − Αρχικό απόθεμα', 'Sales + Closing inventory − Opening inventory')]] },
    { id: 'material', ch: '600-5', title: L('Αποκλίσεις υλικών', 'Material variances'),
      inputs: [['sk', L('Πρότυπα κιλά ανά μονάδα', 'Standard kg per unit'), 2, 'n'], ['sp', L('Πρότυπη τιμή ανά κιλό (SP)', 'Standard price per kg (SP)'), 5, '€'], ['u', L('Μονάδες που παρήχθησαν', 'Units produced'), 500, 'n'], ['aq', L('Πραγματικά κιλά (AQ)', 'Actual kg (AQ)'), 1100, 'n'], ['ap', L('Πραγματική τιμή ανά κιλό (AP)', 'Actual price per kg (AP)'), 4.8, '€']],
      outputs: [[L('Πρότυπη ποσότητα (SQ)', 'Standard quantity (SQ)'), function (v) { return v.sk * v.u; }, 'n', L('Πρότυπα κιλά × Παραγωγή', 'Std kg per unit × Output')],
        [L('Απόκλιση τιμής', 'Price variance'), function (v) { return (v.sp - v.ap) * v.aq; }, 'var', '(SP − AP) × AQ'],
        [L('Απόκλιση χρήσης', 'Usage variance'), function (v) { return (v.sk * v.u - v.aq) * v.sp; }, 'var', '(SQ − AQ) × SP'],
        [L('Συνολική απόκλιση υλικών', 'Total material variance'), function (v) { return (v.sp - v.ap) * v.aq + (v.sk * v.u - v.aq) * v.sp; }, 'var', L('Τιμής + Χρήσης', 'Price + Usage')]],
      note: L('Άσκηση 5: τιμής 220 € F, χρήσης 500 € A, σύνολο 280 € A.', 'Exercise 5: price €220 F, usage €500 A, total €280 A.') },
    { id: 'labour', ch: '600-5', title: L('Αποκλίσεις εργασίας', 'Labour variances'),
      inputs: [['sr', L('Πρότυπη αμοιβή ανά ώρα (SR)', 'Standard rate per hour (SR)'), 15, '€'], ['shu', L('Πρότυπες ώρες ανά μονάδα', 'Standard hours per unit'), 0.5, 'n'], ['u', L('Μονάδες που παρήχθησαν', 'Units produced'), 500, 'n'], ['ah', L('Πραγματικές ώρες (AH)', 'Actual hours (AH)'), 260, 'n'], ['ar', L('Πραγματική αμοιβή ανά ώρα (AR)', 'Actual rate per hour (AR)'), 16, '€']],
      outputs: [[L('Πρότυπες ώρες (SH)', 'Standard hours (SH)'), function (v) { return v.shu * v.u; }, 'n', L('Πρότυπες ώρες × Παραγωγή', 'Std hours per unit × Output')],
        [L('Απόκλιση αμοιβής', 'Rate variance'), function (v) { return (v.sr - v.ar) * v.ah; }, 'var', '(SR − AR) × AH'],
        [L('Απόκλιση αποδοτικότητας', 'Efficiency variance'), function (v) { return (v.shu * v.u - v.ah) * v.sr; }, 'var', '(SH − AH) × SR'],
        [L('Συνολική απόκλιση εργασίας', 'Total labour variance'), function (v) { return (v.sr - v.ar) * v.ah + (v.shu * v.u - v.ah) * v.sr; }, 'var', L('Αμοιβής + Αποδοτικότητας', 'Rate + Efficiency')]] },
    { id: 'salesVar', ch: '600-5', title: L('Αποκλίσεις πωλήσεων', 'Sales variances'),
      inputs: [['ap', L('Πραγματική τιμή πώλησης', 'Actual selling price'), 48, '€'], ['sp', L('Πρότυπη τιμή πώλησης', 'Standard selling price'), 50, '€'], ['au', L('Πραγματικές μονάδες', 'Actual units sold'), 5200, 'n'], ['bu', L('Προϋπολογισμένες μονάδες', 'Budgeted units'), 5000, 'n'], ['sc', L('Πρότυπη συνεισφορά ανά μονάδα', 'Standard contribution per unit'), 20, '€']],
      outputs: [[L('Απόκλιση τιμής πωλήσεων', 'Sales price variance'), function (v) { return (v.ap - v.sp) * v.au; }, 'var', '(AP − SP) × Actual units'],
        [L('Απόκλιση όγκου (οριακή)', 'Sales volume variance (marginal)'), function (v) { return (v.au - v.bu) * v.sc; }, 'var', L('(Πραγμ. − Προϋπ. μονάδες) × Πρότυπη συνεισφορά', '(Actual − Budget units) × Std contribution')]] },
    { id: 'roiri', ch: '600-5', title: L('ROI και υπολειμματικό εισόδημα', 'ROI and residual income'),
      inputs: [['p', L('Κέρδος τμήματος', 'Divisional profit'), 120000, '€'], ['i', L('Επένδυση (απασχολούμενα κεφάλαια)', 'Investment (capital employed)'), 800000, '€'], ['k', L('Κόστος κεφαλαίου', 'Cost of capital'), 12, '%']],
      outputs: [['ROI', function (v) { return v.p / v.i; }, 'pct', L('Κέρδος / Επένδυση', 'Profit / Investment')],
        [L('Υπολειμματικό εισόδημα (RI)', 'Residual income (RI)'), function (v) { return v.p - v.i * v.k; }, 'eur', L('Κέρδος − Επένδυση × Κόστος κεφαλαίου', 'Profit − Investment × Cost of capital')],

    { id: 'transfer', ch: '600-5', title: L('Τιμές μεταβίβασης', 'Transfer pricing'),

      outputs: [[L('Ελάχιστη τιμή μεταβίβασης', 'Minimum transfer price'), function (v) { return v.vc + v.oc; }, 'eur', L('Μεταβλητό + Κόστος ευκαιρίας', 'Variable cost + Opportunity cost')],
        [L('Μέγιστη τιμή μεταβίβασης', 'Maximum transfer price'), function (v) { return v.mp; }, 'eur', L('Τιμή αγοράς', 'Market price')]] },
    { id: 'makebuy', ch: '600-6', title: L('Παραγωγή ή αγορά', 'Make or buy'),

      outputs: [[L('Πλήρες κόστος (όχι σχετικό)', 'Full cost (not relevant)'), function (v) { return v.vc + v.af; }, 'eur', L('Μεταβλητό + Επιμερισμένο σταθερό', 'Variable + Allocated fixed')],
        [L('Σχετικό κόστος παραγωγής', 'Relevant cost of making'), function (v) { return v.vc + v.avf; }, 'eur', L('Μεταβλητό + Αποφεύξιμο σταθερό', 'Variable + Avoidable fixed')],
        [L('Απόφαση', 'Decision'), function (v) { return v.vc + v.avf < v.sp ? ['make', 'good'] : ['buy', 'good']; }, 'dec', L('Παραγωγή αν σχετικό κόστος < τιμή αγοράς', 'Make if relevant cost < purchase price')],
        [L('Εξοικονόμηση ανά μονάδα', 'Saving per unit'), function (v) { return Math.abs(v.sp - v.vc - v.avf); }, 'eur', '|Supplier price − Relevant cost|']] },
    { id: 'special', ch: '600-6', title: L('Ειδική παραγγελία', 'Special order'),

      outputs: [[L('Ελάχιστη αποδεκτή τιμή', 'Minimum acceptable price'), function (v) { return v.vc + v.oc; }, 'eur', L('Μεταβλητό + Κόστος ευκαιρίας', 'Variable cost + Opportunity cost')],
        [L('Απόφαση', 'Decision'), function (v) { return v.p > v.vc + v.oc ? ['accept', 'good'] : ['reject', 'bad']; }, 'dec', L('Αποδοχή αν τιμή > ελάχιστη', 'Accept if price > minimum')]],
      note: L('Κόστος ευκαιρίας 0 όταν υπάρχει αδρανής δυναμικότητα.', 'Opportunity cost is 0 when there is spare capacity.') },
    { id: 'closeDiv', ch: '600-6', title: L('Κλείσιμο τμήματος', 'Closing a division'),

      outputs: [[L('Λογιστικό αποτέλεσμα μετά τον επιμερισμό', 'Reported profit after allocation'), function (v) { return v.c - v.af - v.al; }, 'eur', L('Συνεισφορά − Αποφεύξιμα − Επιμερισμένα', 'Contribution − Avoidable − Allocated')],
        [L('Συνεισφορά μετά τα αποφεύξιμα', 'Contribution after avoidable costs'), function (v) { return v.c - v.af; }, 'eur', L('Συνεισφορά − Αποφεύξιμα σταθερά', 'Contribution − Avoidable fixed costs')],
        [L('Απόφαση', 'Decision'), function (v) { return v.c - v.af > 0 ? ['keep', 'good'] : ['close', 'bad']; }, 'dec', L('Διατήρηση αν > 0', 'Keep if > 0')]] },
    { id: 'limiting', ch: '600-6', title: L('Περιοριστικός παράγοντας', 'Limiting factor'),

        [L('Προτεραιότητα', 'Priority'), function (v) { return v.cb / v.hb > v.ca / v.ha ? ['bFirst', 'info'] : ['aFirst', 'info']; }, 'dec', L('Κατάταξη ανά περιοριστικό παράγοντα', 'Rank by contribution per limiting factor')]],
      note: L('Άσκηση 6: A 10 €, B 12 €, πρώτα το B.', 'Exercise 6: A €10, B €12, B first.') },
    { id: 'pricing', ch: '600-6', title: L('Τιμολόγηση και ελαστικότητα', 'Pricing and elasticity'),
      inputs: [['fc', L('Πλήρες κόστος ανά μονάδα', 'Full cost per unit'), 40, '€'], ['mu', L('Περιθώριο κέρδους (mark-up)', 'Mark-up'), 25, '%'], ['q0', L('Ποσότητα πριν', 'Quantity before'), 1000, 'n'], ['q1', L('Ποσότητα μετά', 'Quantity after'), 900, 'n'], ['p0', L('Τιμή πριν', 'Price before'), 50, '€'], ['p1', L('Τιμή μετά', 'Price after'), 55, '€']],
      outputs: [[L('Τιμή κόστους-συν', 'Cost-plus price'), function (v) { return v.fc * (1 + v.mu); }, 'eur', L('Κόστος × (1 + Mark-up)', 'Cost × (1 + Mark-up)')],
        [L('Ελαστικότητα ζήτησης (PED)', 'Price elasticity (PED)'), function (v) { return ((v.q1 - v.q0) / v.q0) / ((v.p1 - v.p0) / v.p0); }, 'n', L('% μεταβολή ποσότητας / % μεταβολή τιμής', '% change in quantity / % change in price')],
        [L('Χαρακτηρισμός', 'Classification'), function (v) { var e = Math.abs(((v.q1 - v.q0) / v.q0) / ((v.p1 - v.p0) / v.p0)); return e > 1 ? ['elastic', 'info'] : e < 1 ? ['inelastic', 'info'] : ['unit', 'info']; }, 'dec', '|PED| > 1']] },
    { id: 'fv', ch: '610-1', title: L('Μελλοντική αξία', 'Future value'),

        [L('Συντελεστής ανατοκισμού', 'Compound factor'), function (v) { return Math.pow(1 + v.r, v.n); }, 'n4', '(1 + r)^n']],

    { id: 'pv', ch: '610-1', title: L('Παρούσα αξία', 'Present value'),

    { id: 'annuity', ch: '610-1', title: L('Ράντα (annuity)', 'Annuity'),

      outputs: [[L('Συντελεστής ράντας', 'Annuity factor'), function (v) { return (1 - Math.pow(1 + v.r, -v.n)) / v.r; }, 'n4', '[1 − (1 + r)^−n] / r'],
        [L('Παρούσα αξία ράντας', 'PV of annuity'), function (v) { return v.c * (1 - Math.pow(1 + v.r, -v.n)) / v.r; }, 'eur', 'C × [1 − (1 + r)^−n] / r']],
      note: L('Άσκηση 2: 3.992,71 €. Excel: PV(rate, nper, −C).', 'Exercise 2: €3,992.71. Excel: PV(rate, nper, −C).') },
    { id: 'loan', ch: '610-1', title: L('Δόση δανείου', 'Loan repayment'),

      outputs: [[L('Δόση ανά περίοδο', 'Payment per period'), function (v) { var i = v.apr / v.m, n = v.y * v.m; return v.L * i / (1 - Math.pow(1 + i, -n)); }, 'eur', 'PV × i / [1 − (1 + i)^−n]'],
        [L('Αριθμός δόσεων', 'Number of payments'), function (v) { return v.y * v.m; }, 'int', L('Έτη × m', 'Years × m')],
        [L('Σύνολο πληρωμών', 'Total paid'), function (v) { var i = v.apr / v.m, n = v.y * v.m; return n * v.L * i / (1 - Math.pow(1 + i, -n)); }, 'eur', L('Δόση × Αριθμός δόσεων', 'Payment × Number of payments')],
        [L('Συνολικοί τόκοι', 'Total interest'), function (v) { var i = v.apr / v.m, n = v.y * v.m; return n * v.L * i / (1 - Math.pow(1 + i, -n)) - v.L; }, 'eur', L('Σύνολο πληρωμών − Δάνειο', 'Total paid − Loan')]],
      note: L('Παράδειγμα: 1.319,91 € τον μήνα. Excel: PMT(rate, nper, −PV).', 'Example: €1,319.91 a month. Excel: PMT(rate, nper, −PV).') },
    { id: 'perp', ch: '610-1', title: L('Διηνεκείς ράντες', 'Perpetuities'),

      outputs: [[L('ΠΑ διηνεκούς', 'PV of perpetuity'), function (v) { return v.c / v.r; }, 'eur', 'C / r'],
        [L('ΠΑ αυξανόμενης διηνεκούς', 'PV of growing perpetuity'), function (v) { return v.r > v.g ? v.c / (v.r - v.g) : NaN; }, 'eur', L('C₁ / (r − g), με r > g', 'C₁ / (r − g), r > g')]] },
    { id: 'ear', ch: '610-1', title: L('Πραγματικό επιτόκιο και Fisher', 'Effective rate and Fisher'),
      inputs: [['apr', L('Ονομαστικό ετήσιο επιτόκιο (APR)', 'Nominal annual rate (APR)'), 5, '%'], ['m', L('Ανατοκισμοί ανά έτος', 'Compounding periods per year'), 12, 'n'], ['nom', L('Ονομαστικό επιτόκιο', 'Nominal rate'), 8, '%'], ['inf', L('Πληθωρισμός', 'Inflation'), 3, '%']],
      outputs: [['EAR', function (v) { return Math.pow(1 + v.apr / v.m, v.m) - 1; }, 'pct', '(1 + APR / m)^m − 1'],
        [L('Πραγματικό επιτόκιο (Fisher)', 'Real rate (exact Fisher)'), function (v) { return (1 + v.nom) / (1 + v.inf) - 1; }, 'pct', '(1 + nominal) / (1 + inflation) − 1'],
        [L('Πραγματικό επιτόκιο (προσέγγιση)', 'Real rate (approximation)'), function (v) { return v.nom - v.inf; }, 'pct', L('Ονομαστικό − Πληθωρισμός', 'Nominal − Inflation')]] },
    { id: 'capbud', ch: '610-2', title: L('Αξιολόγηση επένδυσης: NPV, IRR, payback', 'Investment appraisal: NPV, IRR, payback'),

        ['IRR', function (v) { return irr(v.cf); }, 'pct', L('Επιτόκιο όπου NPV = 0', 'Rate at which NPV = 0')],
        [L('Απόφαση IRR', 'IRR decision'), function (v) { var i = irr(v.cf); return isFinite(i) && i > v.r ? ['accept', 'good'] : ['reject', 'bad']; }, 'dec', L('Αποδοχή αν IRR > κόστος κεφαλαίου', 'Accept if IRR > cost of capital')],
        [L('Δείκτης αποδοτικότητας (PI)', 'Profitability index'), function (v) { return (npv(v.r, v.cf) - v.cf[0]) / -v.cf[0]; }, 'n', L('ΠΑ εισροών / Αρχική επένδυση', 'PV of inflows / Initial investment')],
        [L('Περίοδος αποπληρωμής', 'Payback'), function (v) { return payback(v.cf); }, 'yrs', L('Έτη ως την ανάκτηση του κεφαλαίου', 'Years until cumulative cash flow ≥ 0')],
        [L('Προεξοφλημένη αποπληρωμή', 'Discounted payback'), function (v) { return payback(v.cf.map(function (c, t) { return c / Math.pow(1 + v.r, t); })); }, 'yrs', L('Ίδιο, με προεξοφλημένες ροές', 'Same, with discounted cash flows')]],
      note: L('Άσκηση 3: NPV −2.103,68 €, IRR ≈ 8,9%, payback 2,6 έτη. Χώρισε τις ροές με ;', 'Exercise 3: NPV −€2,103.68, IRR ≈ 8.9%, payback 2.6 years. Separate flows with ;') },
    { id: 'scen', ch: '610-3', title: L('Αναμενόμενη απόδοση και κίνδυνος', 'Expected return and risk'),
      inputs: [['p', L('Πιθανότητες σεναρίων', 'Scenario probabilities'), '0.3; 0.5; 0.2', 'list'], ['R', L('Απόδοση ανά σενάριο (%)', 'Return per scenario (%)'), '15; 8; -5', 'list%']],
      outputs: [['E(R)', function (v) { return sum(v.p.map(function (p, i) { return p * (v.R[i] || 0); })); }, 'pct', 'Σ pᵢ × Rᵢ'],
        [L('Διακύμανση', 'Variance'), function (v) { var e = sum(v.p.map(function (p, i) { return p * (v.R[i] || 0); })); return sum(v.p.map(function (p, i) { return p * Math.pow((v.R[i] || 0) - e, 2); })); }, 'n6', 'Σ pᵢ × (Rᵢ − E(R))²'],
        [L('Τυπική απόκλιση (σ)', 'Standard deviation (σ)'), function (v) { var e = sum(v.p.map(function (p, i) { return p * (v.R[i] || 0); })); return Math.sqrt(sum(v.p.map(function (p, i) { return p * Math.pow((v.R[i] || 0) - e, 2); }))); }, 'pct', '√σ²'],

    { id: 'hpr', ch: '610-3', title: L('Απόδοση περιόδου διακράτησης', 'Holding period return'),

    { id: 'port', ch: '610-3', title: L('Χαρτοφυλάκιο δύο στοιχείων', 'Two-asset portfolio'),
      inputs: [['w1', L('Βάρος στο A (w₁)', 'Weight in A (w₁)'), 60, '%'], ['r1', L('Απόδοση A', 'Return A'), 10, '%'], ['s1', L('Κίνδυνος A (σ₁)', 'Risk A (σ₁)'), 20, '%'], ['r2', L('Απόδοση B', 'Return B'), 6, '%'], ['s2', L('Κίνδυνος B (σ₂)', 'Risk B (σ₂)'), 10, '%'], ['rho', L('Συσχέτιση (ρ)', 'Correlation (ρ)'), 0.3, 'n']],
      outputs: [['E(Rp)', function (v) { return v.w1 * v.r1 + (1 - v.w1) * v.r2; }, 'pct', 'w₁R₁ + w₂R₂'],

        [L('Σταθμισμένος μέσος κίνδυνος', 'Weighted average risk'), function (v) { return v.w1 * v.s1 + (1 - v.w1) * v.s2; }, 'pct', 'w₁σ₁ + w₂σ₂'],
        [L('Όφελος διαφοροποίησης', 'Diversification benefit'), function (v) { var w2 = 1 - v.w1; return v.w1 * v.s1 + w2 * v.s2 - Math.sqrt(v.w1 * v.w1 * v.s1 * v.s1 + w2 * w2 * v.s2 * v.s2 + 2 * v.w1 * w2 * v.s1 * v.s2 * v.rho); }, 'pct', L('Σταθμ. μέσο σ − σp', 'Weighted average σ − σp')]],
      note: L('Άσκηση 8: E(Rp) 8,4%, σp 13,74%.', 'Exercise 8: E(Rp) 8.4%, σp 13.74%.') },
    { id: 'capm', ch: '610-3', title: 'CAPM',

    { id: 'beta', ch: '610-3', title: L('Beta με παλινδρόμηση', 'Beta by regression'),

<script>
(function () {

function t(k) {
  var v = I18N[LANG][k]; if (v === undefined) v = I18N.el[k]; if (v === undefined) return k;
  var args = Array.prototype.slice.call(arguments, 1);
  if (typeof v === 'function') return v.apply(null, args);
  if (typeof v !== 'string') return v;
  return v.replace(/\{(\d)\}/g, function (_, i) { return args[+i]; });
}
var nf0, nf2;
function setFormats() {
  var loc = LANG === 'en' ? 'en-GB' : 'el-GR';
  nf0 = new Intl.NumberFormat(loc, { maximumFractionDigits: 0 });
  nf2 = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
setFormats();
function money(abs, sfxEl, sfxEn, neg) { return LANG === 'en' ? (neg ? '-' : '') + '€' + abs + sfxEn : (neg ? '-' : '') + abs + sfxEl + ' €'; }
var eur = function (v, d) { return money((d ? nf2 : nf0).format(Math.abs(v)), '', '', v < 0); };
var keur = function (v) {

  if (a >= 1e6) return money(nf2.format(a / 1e6), ' εκ.', 'm', n);
  if (a >= 1e4) return money(nf0.format(a / 1e3), ' χιλ.', 'k', n);
  return money(nf0.format(a), '', '', n);
};
var decSep = function (s) { return LANG === 'en' ? s : s.replace('.', ','); };
var pct = function (v, d) { return isFinite(v) ? decSep((v * 100).toFixed(d == null ? 1 : d)) + '%' : '–'; };
var dec = function (v, d) { return isFinite(v) ? decSep(v.toFixed(d == null ? 2 : d)) : '–'; };
var signed = function (s, v) { return (v >= 0 ? '+' : '') + s; };

function acct(a) { if (!S.sample || LANG !== 'en') return a; return I18N.en.acct[a] || a; }

  if (n[0] === 'z') return t(k, dec(n[1], 1), nf0.format(n[2]));

}

  var ok = function () { toast(done); };

  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

    }

(function () { var other = I18N[LANG === 'en' ? 'el' : 'en'].budNames, mine = t('budNames'); S.budget.forEach(function (l) { var i = other.indexOf(l.name); if (i > -1) l.name = mine[i]; }); })();
function persist() { try { localStorage.setItem(STORE, JSON.stringify({ fin: S.fin, budget: S.budget, client: $('#client').value, period: $('#period').value, thr: $('#thr').value })); } catch (e) {} }

var R = {};
function filled(v) { return v !== null && v !== undefined && v !== '' && isFinite(v); }
function compute() {
  var thr = parseFloat($('#thr').value) || 0;
  R.profile = LL.profile(S.rows);
  R.benford = LL.benford(S.rows);
  R.audit = LL.auditTests(S.rows, thr);
  R.conc = LL.concentration(S.rows);
  R.monthly = LL.monthly(S.rows);
  R.fc = LL.forecast(R.monthly, S.horizon);
  var req = LL.FIN_FIELDS.filter(function (f) { return f[2] !== true; });
  var finOk = req.every(function (f) { return filled(S.fin.cy[f[0]]); });

  R.finOk = finOk;
  R.ratios = finOk ? LL.ratios(S.fin.cy, pyOk ? S.fin.py : null) : [];
  R.z = finOk ? LL.altman(S.fin.cy) : null;
  R.zPy = pyOk ? LL.altman(S.fin.py) : null;
  R.var = LL.variance(S.budget);

}

var tipEur = function (ctx) { var v = ctx.raw; if (Array.isArray(v)) v = v[1] - v[0]; return (ctx.dataset.label ? ctx.dataset.label + ': ' : '') + eur(v); };

function bridgeCfg(c, light) {

function narrative() {
  var out = { findings: [], recs: [], kpis: [], level: 'good' };
  var sev = { good: 0, info: 0, warn: 1, bad: 2 }, worst = 0;
  function add(area, lv, text) { out.findings.push({ area: area, lv: lv, text: text }); worst = Math.max(worst, sev[lv] || 0); }
  var g = function (id) { return R.ratios.filter(function (r) { return r.id === id; })[0]; };
  if (R.finOk) {
    var fy = S.fin.cy, py = S.fin.py, growth = filled(py.rev) && py.rev ? fy.rev / py.rev - 1 : NaN;
    var nm = g('nm'), cur = g('cur'), dso = g('dso'), oq = g('ocfnp');
    out.kpis.push({ l: t('kRev'), v: keur(fy.rev), s: isFinite(growth) ? t('kRevS', signed(pct(growth), growth)) : '', lv: !isFinite(growth) || growth >= 0 ? 'good' : 'warn' });
    out.kpis.push({ l: t('kNm'), v: pct(nm.cy), s: isFinite(nm.py) ? t('prior', pct(nm.py)) : '', lv: nm.rag });
    out.kpis.push({ l: t('kZ'), v: dec(R.z.z), s: t('z' + R.z.zone), lv: R.z.zone });
    if (isFinite(growth)) add('res', growth >= 0 ? 'good' : 'warn', t('nRev', growth >= 0, pct(Math.abs(growth)), keur(fy.rev), pct(nm.cy), pct(nm.py)));
    if (isFinite(cur.py)) add('liq', cur.rag, t('nLiq', dec(cur.cy), dec(cur.py), fy.cash < py.cash, keur(fy.cash)));
    if (isFinite(dso.py) && dso.cy - dso.py > 3) {
      add('wc', dso.rag === 'good' ? 'warn' : dso.rag, t('nDso', nf0.format(dso.py), nf0.format(dso.cy), keur((dso.cy - dso.py) / 365 * fy.rev)));

function loadFile(file) {
  if (typeof XLSX === 'undefined') { toast(t('tLib')); return; }
  var isCsv = /\.(csv|txt)$/i.test(file.name);
  var rd = new FileReader();
  rd.onload = function (e) {
    try {
      var wb = isCsv ? XLSX.read(e.target.result, { type: 'string', raw: true }) : XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var m = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      var hIdx = 0; for (var i = 0; i < Math.min(10, m.length); i++) { if ((m[i] || []).filter(function (x) { return typeof x === 'string' && x.trim(); }).length >= 2) { hIdx = i; break; } }
      S.rawHeaders = (m[hIdx] || []).map(function (h) { return h == null || h === '' ? null : String(h); });
      S.matrix = m.slice(hIdx + 1);
      S.fileName = file.name;
      buildMapping(LL.detectColumns(S.rawHeaders.map(function (h) { return h || ''; })));
      S.fileInfo = { k: 'read', name: file.name, n: S.matrix.length, sheet: wb.SheetNames[0] };
      $('#fileInfo').textContent = fileInfoText();
    } catch (err) { toast(t('tReadFail')); }
  };
  if (isCsv) rd.readAsText(file); else rd.readAsArrayBuffer(file);
}

  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); showSlide(deckI + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showSlide(deckI - 1); }
  if (e.key === 'Escape') closeDeck();
});
['client', 'period'].forEach(function (id) { $('#' + id).addEventListener('input', function () { persist(); if (current === 'board') renderBoard(); }); });
$('#thr').addEventListener('change', refresh);
$('#file').addEventListener('change', function (e) { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });
var drop = $('#drop');
['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
$('#resetSample').addEventListener('click', function (e) { e.preventDefault(); S.rows = LL.sampleLedger(); S.sample = true; S.filter = null; $('#mapPanel').hidden = true; S.fileInfo = { k: 'sample' }; refresh(); });
$('#applyMap').addEventListener('click', applyMapping);
$('#finBody').addEventListener('input', function (e) { var el = e.target; if (!el.dataset.k) return; var v = parseFloat(el.value); S.fin[el.dataset.y][el.dataset.k] = isFinite(v) ? v : null; compute(); renderFin(); persist(); });
$('#finSample').addEventListener('click', function () { S.fin = JSON.parse(JSON.stringify(LL.SAMPLE_FIN)); buildFinForm(); refresh(); });
$('#finClear').addEventListener('click', function () { S.fin = { cy: {}, py: {} }; buildFinForm(); refresh(); });
$('#budBody').addEventListener('input', function (e) {
  var el = e.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.f) return;
  var l = S.budget[+tr.dataset.i]; l[el.dataset.f] = (el.dataset.f === 'b' || el.dataset.f === 'a') ? (parseFloat(el.value) || 0) : el.value;
  compute(); renderBud(false); persist();
});
$('#budBody').addEventListener('change', function (e) { if (e.target.dataset.f === 'type') { compute(); renderBud(false); persist(); } });
$('#budBody').addEventListener('click', function (e) { var b = e.target.closest('[data-del]'); if (!b) return; S.budget.splice(+b.dataset.del, 1); compute(); renderBud(true); persist(); });
$('#budAdd').addEventListener('click', function () { S.budget.push({ name: t('newLine'), type: 'exp', b: 0, a: 0 }); compute(); renderBud(true); persist(); });
$('#budSample').addEventListener('click', function () { S.budget = sampleBudget(); compute(); renderBud(true); persist(); });
$('#tests').addEventListener('click', function (e) { var b = e.target.closest('.test'); if (!b) return; S.filter = S.filter === b.dataset.t ? null : b.dataset.t; document.querySelectorAll('.test').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.t === S.filter); }); renderExceptions(); });
$('#copyEx').addEventListener('click', function () {
  var lines = [[t('thDate'), t('thParty'), t('thAccount'), t('thDoc'), t('thAmountPlain'), t('thFindings')].join('\t')].concat(exList().map(function (f) { var r = f.row; return [dfmt(r.date), r.party, acct(r.account), r.doc, decSep(String(r.amount)), Object.keys(f.tests).map(function (k) { return t('t_' + k) + ' (' + noteText(f.tests[k]) + ')'; }).join('; ')].join('\t'); }));
  copyText(lines.join('\n'), t('tCopied', nf0.format(lines.length - 1)));
});
$('#copyReport').addEventListener('click', function () { copyText(reportText(), t('tReportCopied')); });
$('#horizon').addEventListener('change', function (e) { S.horizon = +e.target.value; refresh(); });
document.querySelectorAll('.seg button[data-mode]').forEach(function (b) { b.addEventListener('click', function () { K.mode = b.dataset.mode; renderKit(); }); });
$('#kitSearch').addEventListener('input', function (e) { K.q = e.target.value; renderKit(); });
$('#kitCh').addEventListener('change', function (e) { K.ch = e.target.value; renderKit(); });
$('#kitCalcs').addEventListener('input', function (e) {
  var el = e.target; if (!el.dataset.c) return;
  var c = CALC_BY_ID[el.dataset.c]; (K.vals[c.id] = K.vals[c.id] || {})[el.dataset.k] = el.value;
  $('#out-' + c.id).innerHTML = calcOutputsHtml(c); kitPersist();
});
$('#kitCalcs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-reset]'); if (!b) return;
  var c = CALC_BY_ID[b.dataset.reset]; delete K.vals[c.id]; kitPersist();
  var card = document.getElementById('calc-' + c.id); var tmp = document.createElement('div'); tmp.innerHTML = calcHtml(c); card.replaceWith(tmp.firstChild);
});
$('#kitLib').addEventListener('click', function (e) { var b = e.target.closest('[data-open]'); if (b) openCalc(b.dataset.open); });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { RENDER[current](); }); } catch (e) {}
new MutationObserver(function () { RENDER[current](); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- boot ---------- */
applyStatic();
buildFinForm();
compute();
var startTab = 'data';
try { var h = (location.hash || '').slice(1); var st = localStorage.getItem(STORE + ':tab'); startTab = RENDER[h] ? h : RENDER[st] ? st : 'data'; } catch (e) {}
show(startTab);
window.__ll = { setLang: setLang, show: show, openDeck: openDeck, reportText: reportText, lang: function () { return LANG; } };
})();

</script>

</body>
</html>
