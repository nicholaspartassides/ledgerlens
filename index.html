<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ledgerlens Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: engagement bar on top, ledger-tab rail on the left (top strip on phones), working canvas on the right. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #e4ebe8; --ink: #13201c; --muted: #56675f; --line: #cfd9d5;
  --accent: #17614f; --accent-ink: #ffffff; --accent-soft: #d6e8e1; --brass: #8f6b1f;
  --good: #1d7a4b; --good-soft: #dcefe4; --warn: #a86b12; --warn-soft: #f6ead3; --bad: #b0352c; --bad-soft: #f6dcd9;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #15201d; --surface-2: #1c2a26; --ink: #e3ece8; --muted: #92a69e; --line: #2a3b36;
  --accent: #52b796; --accent-ink: #08130f; --accent-soft: #1b3830; --brass: #d4a94e;
  --good: #4fc287; --good-soft: #173528; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #ec6c61; --bad-soft: #3e1d1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #15201d; --surface-2: #1c2a26; --ink: #e3ece8; --muted: #92a69e; --line: #2a3b36;
  --accent: #52b796; --accent-ink: #08130f; --accent-soft: #1b3830; --brass: #d4a94e;
  --good: #4fc287; --good-soft: #173528; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #ec6c61; --bad-soft: #3e1d1a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.7rem; line-height: 1.15; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
.num, td.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* engagement bar */
.top { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; }
.brand span { color: var(--muted); font-size: 0.82rem; }
.engagement { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .field .lbl { font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; min-width: 0; }
.engagement input { width: 190px; max-width: 100%; }
.engagement input#thr { width: 120px; }
.langsw { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.langsw button { border: 0; background: none; padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.04em; color: var(--muted); }
.langsw button + button { border-left: 1px solid var(--line); }
.langsw button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100% - 70px); }
nav.rail { border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.rail button { display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 4px; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 9px 10px; cursor: pointer; color: var(--muted); }
.rail button .k { font-family: var(--f-data); font-size: 0.75rem; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button[aria-selected=true] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail button[aria-selected=true] .k { color: var(--accent); }
.rail .sep { height: 1px; background: var(--line); margin: 10px 8px; }
.rail .present { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.rail .present:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }

main { padding-block: 26px 60px; padding-inline: 28px; min-width: 0; }
section.view { display: flex; flex-direction: column; gap: 22px; max-width: 1180px; }
.head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.head p { max-width: 68ch; color: var(--muted); margin-top: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel > h3 + * { margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.chartbox { position: relative; height: 290px; }
.chartbox.tall { height: 340px; }
.note { font-size: 0.82rem; color: var(--muted); max-width: 75ch; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 13px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.stat { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.stat .v { font-family: var(--f-data); font-size: 1.32rem; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.stat.flag-good { box-shadow: inset 3px 0 0 var(--good); }
.stat.flag-warn { box-shadow: inset 3px 0 0 var(--warn); }
.stat.flag-bad { box-shadow: inset 3px 0 0 var(--bad); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--surface-2); color: var(--muted); }
.badge-sample { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--brass); border: 1px solid currentColor; border-radius: 999px; padding: 2px 9px; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.grp td { background: var(--bg); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
tr.total td { font-weight: 600; background: var(--surface-2); }
td input[type=number], td input[type=text] { width: 100%; min-width: 110px; padding: 5px 8px; }
td input[type=number] { text-align: right; font-family: var(--f-data); }
.scroll { max-height: 460px; overflow: auto; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* test cards */
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.test { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.test:hover { border-color: var(--accent); }
.test[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.test .t { font-weight: 600; }
.test .n { font-family: var(--f-data); font-size: 1.25rem; }
.test .d { font-size: 0.78rem; color: var(--muted); }

/* upload */
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: space-between; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { display: none; }
.mapping { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.mapping select { width: 100%; }

.finform td:first-child { white-space: nowrap; }

/* z-score scale */
.zscale { position: relative; height: 34px; margin-top: 14px; border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: 22fr 30fr 48fr; }
.zscale div { display: flex; align-items: flex-end; padding: 0 6px 3px; font-size: 0.7rem; font-weight: 600; }
.zscale .z1 { background: var(--bad-soft); color: var(--bad); }
.zscale .z2 { background: var(--warn-soft); color: var(--warn); }
.zscale .z3 { background: var(--good-soft); color: var(--good); }
.zmark { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
.zwrap { position: relative; }
.zticks { display: grid; grid-template-columns: 22fr 30fr 48fr; font-size: 0.72rem; color: var(--muted); font-family: var(--f-data); margin-top: 4px; }

/* board report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 30px 34px; display: flex; flex-direction: column; gap: 24px; }
.report header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.report h2 { font-size: 2rem; }
.overall { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r); }
.overall.good { background: var(--good-soft); } .overall.warn { background: var(--warn-soft); } .overall.bad { background: var(--bad-soft); }
.overall .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.overall.good .dot { background: var(--good); } .overall.warn .dot { background: var(--warn); } .overall.bad .dot { background: var(--bad); }
.overall p { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.35; }
.findings { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.findings li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.findings li:last-child { border-bottom: 0; }
.findings .area { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.recs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.recs li::marker { font-family: var(--f-data); color: var(--accent); }

/* presentation */
.deck { position: fixed; inset: 0; z-index: 50; background: #0b1110; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.slide { --s-bg: #fbfcfb; --s-ink: #12201c; --s-muted: #5a6a63; --s-line: #d3ddd9; background: var(--s-bg); color: var(--s-ink); width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; border-radius: 4px; padding: 4.2% 5%; display: flex; flex-direction: column; gap: 3%; overflow: hidden; container-type: inline-size; }
.slide .s-eyebrow { font-size: 1.5cqw; letter-spacing: 0.1em; text-transform: uppercase; color: #17614f; font-weight: 600; }
.slide h1 { font-size: 4.6cqw; line-height: 1.08; color: var(--s-ink); }
.slide h2 { font-size: 3.1cqw; line-height: 1.15; color: var(--s-ink); }
.slide p, .slide li { font-size: 1.75cqw; line-height: 1.4; }
.slide .s-body { flex: 1; min-height: 0; display: grid; gap: 3cqw; }
.slide .s-two { grid-template-columns: 1fr 1fr; }
.slide .s-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqw; }
.slide .s-kpi { border-top: 3px solid var(--s-line); padding-top: 1cqw; }
.slide .s-kpi.good { border-color: #1d7a4b; } .slide .s-kpi.warn { border-color: #a86b12; } .slide .s-kpi.bad { border-color: #b0352c; }
.slide .s-kpi .l { font-size: 1.3cqw; color: var(--s-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.slide .s-kpi .v { font-family: var(--f-data); font-size: 3.2cqw; margin-top: 0.4cqw; }
.slide .s-kpi .s { font-size: 1.3cqw; color: var(--s-muted); }
.slide .s-chart { position: relative; min-height: 0; }
.slide ul { margin: 0; padding-left: 2.2cqw; display: flex; flex-direction: column; gap: 1.1cqw; }
.slide table { font-size: 1.5cqw; }
.slide th { background: #eef2f0; color: #5a6a63; }
.slide td { border-color: #d3ddd9; }
.slide .s-foot { display: flex; justify-content: space-between; font-size: 1.15cqw; color: var(--s-muted); border-top: 1px solid var(--s-line); padding-top: 1cqw; }
.slide .s-title { justify-content: center; }
.slide .s-rule { width: 9cqw; height: 0.5cqw; background: #17614f; }
.deckbar { display: flex; gap: 10px; align-items: center; color: #c9d6d1; font-family: var(--f-data); font-size: 0.85rem; flex-wrap: wrap; justify-content: center; }
.deckbar button { background: #1c2a26; color: #e3ece8; border: 1px solid #2f413b; border-radius: var(--r); padding: 6px 13px; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: 0.88rem; z-index: 60; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .rail button { grid-template-columns: auto auto; white-space: nowrap; }
  .rail .sep { display: none; }
  main { padding-inline: 16px; }
  .top { padding: 12px 16px; }
  .report { padding: 20px 18px; }
  .findings li { grid-template-columns: 1fr; gap: 2px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .rail button, .test, .btn, .langsw button { transition: background .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="top">
  <div class="brand"><b>Ledgerlens</b><span data-i18n="brandSub"></span></div>
  <div class="engagement">
    <div class="field"><label for="client" data-i18n="lblClient"></label><input type="text" id="client"></div>
    <div class="field"><label for="period" data-i18n="lblPeriod"></label><input type="text" id="period"></div>
    <div class="field"><label for="thr" data-i18n="lblThr"></label><input type="number" id="thr" value="10000" min="0" step="500"></div>
    <div class="field"><span class="lbl" id="langLbl" data-i18n="lblLang"></span>
      <div class="langsw" role="group" aria-labelledby="langLbl"><button type="button" data-lang="el" lang="el">ΕΛ</button><button type="button" data-lang="en" lang="en">EN</button></div>
    </div>
  </div>
</div>

<div class="app">
  <nav class="rail" role="tablist">
    <button role="tab" data-tab="data" aria-selected="true"><span class="k">01</span><span data-i18n="tabData"></span></button>
    <button role="tab" data-tab="fin"><span class="k">02</span><span data-i18n="tabFin"></span></button>
    <button role="tab" data-tab="bud"><span class="k">03</span><span data-i18n="tabBud"></span></button>
    <button role="tab" data-tab="aud"><span class="k">04</span><span data-i18n="tabAud"></span></button>
    <button role="tab" data-tab="trend"><span class="k">05</span><span data-i18n="tabTrend"></span></button>
    <button role="tab" data-tab="board"><span class="k">06</span><span data-i18n="tabBoard"></span></button>
    <div class="sep"></div>
    <button class="present" id="presentBtn"><span class="k">▶</span><span data-i18n="present"></span></button>
  </nav>

  <main>
    <!-- 01 DATA -->
    <section class="view" id="v-data">
      <div class="head">
        <div><div class="eyebrow" data-i18n="step1"></div><h2 data-i18n="dataTitle"></h2><p data-i18n="dataLead"></p></div>
        <span class="badge-sample" id="sampleBadge" data-i18n="sampleBadge"></span>
      </div>
      <label class="drop" id="drop" for="file">
        <div><h3 data-i18n="dropTitle"></h3><p class="muted" id="fileInfo"></p></div>
        <div class="btns"><span class="btn primary" data-i18n="chooseFile"></span><button class="btn" type="button" id="resetSample" data-i18n="resetSample"></button></div>
        <input type="file" id="file" accept=".xlsx,.xls,.csv,.txt">
      </label>
      <div class="panel" id="mapPanel" hidden>
        <h3 data-i18n="mapTitle"></h3>
        <p class="note" data-i18n="mapNote"></p>
        <div class="mapping" id="mapping" style="margin-top:12px"></div>
        <div class="btns" style="margin-top:14px"><button class="btn primary" id="applyMap" data-i18n="apply"></button></div>
      </div>
      <div class="stats" id="profileStats"></div>
      <div class="panel"><h3 data-i18n="dqTitle"></h3><div id="dq"></div></div>
      <div><h3 style="margin-bottom:10px" data-i18n="previewTitle"></h3><div class="tablewrap" id="preview"></div></div>
    </section>

    <!-- 02 FIN -->
    <section class="view" id="v-fin" hidden>
      <div class="head">
        <div><div class="eyebrow" data-i18n="step2"></div><h2 data-i18n="finTitle"></h2><p data-i18n="finLead"></p></div>
        <div class="btns"><button class="btn" id="finSample" data-i18n="loadSample"></button><button class="btn" id="finClear" data-i18n="clear"></button></div>
      </div>
      <div class="grid2">
        <div class="tablewrap finform"><table><thead><tr><th data-i18n="thFigure"></th><th class="num" data-i18n="thCY"></th><th class="num" data-i18n="thPY"></th></tr></thead><tbody id="finBody"></tbody></table></div>
        <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
          <div class="panel"><div class="eyebrow" data-i18n="altmanEyebrow"></div>
            <div style="display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap"><span class="num" style="font-size:2.2rem" id="zVal">–</span><span id="zChip"></span><span class="muted num" id="zPrev"></span></div>
            <div class="zwrap"><div class="zscale"><div class="z1" data-i18n="zRisk"></div><div class="z2" data-i18n="zGrey"></div><div class="z3" data-i18n="zSafe"></div></div><div class="zmark" id="zMark"></div></div>
            <div class="zticks"><span>0</span><span id="zt1"></span><span id="zt2"></span></div>
            <p class="note" style="margin-top:10px" data-i18n="zFormula"></p>
          </div>
          <div class="panel"><h3 data-i18n="wcTitle"></h3><div class="chartbox" style="height:220px"><canvas id="cWC"></canvas></div></div>
        </div>
      </div>
      <div class="tablewrap"><table><thead><tr><th data-i18n="thRatio"></th><th class="num" data-i18n="thCur"></th><th class="num" data-i18n="thPrev"></th><th class="num" data-i18n="thChange"></th><th data-i18n="thRating"></th><th data-i18n="thLimits"></th></tr></thead><tbody id="ratioBody"></tbody></table></div>
      <p class="note" data-i18n="finNote"></p>
    </section>

    <!-- 03 BUDGET -->
    <section class="view" id="v-bud" hidden>
      <div class="head">
        <div><div class="eyebrow" data-i18n="step3"></div><h2 data-i18n="budTitle"></h2><p data-i18n="budLead"></p></div>

<script>
/* ===== Ledgerlens engine: pure analytics, no DOM ===== */
var LL = (function () {
  'use strict';

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function normal(r) {
    var u = 1 - r(), v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  var r2 = function (x) { return Math.round(x * 100) / 100; };

  /* ---------- parsing ---------- */
  function strip(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) {
        var d = new Date(Math.round((v - 25569) * 86400000));
        return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      }
      return null;
    }
    var s = String(v).trim(), m;
    m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
    if (/^\d{5}(\.\d+)?$/.test(s)) return parseDate(parseFloat(s));
    return null;
  }
  function parseAmount(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/[\s €$£]|EUR/gi, '');
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    var c = s.lastIndexOf(','), d = s.lastIndexOf('.');
    if (c > -1 && d > -1) {
      if (c > d) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (c > -1) {
      s = /,\d{1,2}$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (d > -1 && /^-?\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    var n = parseFloat(s);
    if (!isFinite(n)) return null;
    return neg ? -Math.abs(n) : n;
  }

  var KEYS = {
    date: ['date', 'ημερομην', 'ημ/νια', 'ημνια', 'posting', 'trans date', 'value date', 'ημ.'],
    amount: ['amount', 'ποσο', 'αξια', 'value', 'total', 'συνολο', 'net', 'debit', 'χρεωση', 'πληρωμ'],
    party: ['vendor', 'supplier', 'προμηθευτ', 'πελατ', 'customer', 'party', 'payee', 'δικαιουχ', 'επωνυμια', 'name', 'ονομα'],
    account: ['account', 'λογαριασμ', 'category', 'κατηγορ', 'gl', 'cost centre', 'κεντρο κοστους', 'expense'],
    doc: ['invoice', 'τιμολογ', 'doc', 'παραστατ', 'reference', 'ref', 'αρ.', 'αριθμ', 'number', 'no']
  };
  function detectColumns(headers) {
    var map = { date: -1, amount: -1, party: -1, account: -1, doc: -1 };
    var used = {};
    var h = headers.map(strip);
    ['date', 'amount', 'party', 'account', 'doc'].forEach(function (f) {
      for (var k = 0; k < KEYS[f].length && map[f] < 0; k++) {
        for (var i = 0; i < h.length; i++) {
          if (!used[i] && h[i].indexOf(strip(KEYS[f][k])) > -1) { map[f] = i; used[i] = 1; break; }
        }
      }
    });
    return map;
  }
  function buildRows(matrix, map) {
    var out = [];
    for (var i = 0; i < matrix.length; i++) {
      var r = matrix[i] || [];
      var amt = map.amount > -1 ? parseAmount(r[map.amount]) : null;
      var dt = map.date > -1 ? parseDate(r[map.date]) : null;
      if (amt == null && dt == null) continue;
      out.push({
        i: out.length,
        date: dt,
        amount: amt,
        party: map.party > -1 && r[map.party] != null ? String(r[map.party]).trim() : '',
        account: map.account > -1 && r[map.account] != null ? String(r[map.account]).trim() : '',
        doc: map.doc > -1 && r[map.doc] != null ? String(r[map.doc]).trim() : ''
      });
    }
    return out;
  }

  /* ---------- sample ledger (example data, clearly labelled in the UI) ---------- */
  function sampleLedger() {
    var r = rng(20261012);
    var V = [
      ['Άλφα Προμήθειες Λτδ', 'Αναλώσιμα', 450, 9], ['CyTech Solutions Ltd', 'Υπηρεσίες IT', 2800, 4],
      ['Λεμεσός Logistics', 'Μεταφορικά', 1200, 6], ['Ορθοδόξου & Υιοί Λτδ', 'Συντήρηση κτιρίων', 3500, 3],
      ['Kypros Office Supply', 'Αναλώσιμα', 180, 10], ['Μεσόγειος Ενέργεια', 'Ενέργεια', 2200, 4],
      ['Pafos Print House', 'Μάρκετινγκ', 650, 5], ['Τρόοδος Catering', 'Τροφοδοσία', 380, 7],
      ['Nicosia Legal Partners', 'Νομικά', 4200, 2], ['Larnaca Freight Co', 'Μεταφορικά', 1900, 5],
      ['Αθηαίνου Συντηρήσεις', 'Συντήρηση κτιρίων', 900, 6], ['Blue Wave Marketing', 'Μάρκετινγκ', 3100, 3],
      ['Akamas Insurance Brokers', 'Ασφάλιστρα', 5200, 2], ['Οίκος Καθαρισμών Λτδ', 'Καθαριότητα', 520, 6],
      ['Synergy IT Services', 'Υπηρεσίες IT', 1500, 5]
    ];
    var wsum = V.reduce(function (a, v) { return a + v[3]; }, 0);
    function pick() { var x = r() * wsum; for (var k = 0; k < V.length; k++) { x -= V[k][3]; if (x <= 0) return V[k]; } return V[V.length - 1]; }
    var season = [0.95, 0.9, 1, 1, 1.02, 1, 0.98, 0.8, 1, 1.05, 1.08, 1.2];
    var rows = [], seq = 41000;
    function weekday(y, m) {
      var dim = new Date(y, m + 1, 0).getDate();
      var d = new Date(y, m, 1 + Math.floor(r() * dim));
      if (d.getDay() === 6) d.setDate(d.getDate() - 1);
      if (d.getDay() === 0) d.setDate(d.getDate() + 1);
      if (d.getMonth() !== m) d = new Date(y, m, d.getMonth() > m ? dim - 2 : 3);
      return d;
    }
    for (var mi = 0; mi < 21; mi++) {
      var y = 2025 + Math.floor(mi / 12), m = mi % 12;
      var n = Math.round(70 * (1 + 0.022 * mi) * season[m] * (0.95 + r() * 0.1));
      for (var j = 0; j < n; j++) {
        var v = pick();
        var a = r2(v[2] * Math.exp(0.6 * normal(r)));
        if (a < 12) a = r2(12 + r() * 30);
        if (a % 1000 === 0) a += 7.35;
        if (a >= 9500 && a < 10000) a = r2(a * 1.07);
        rows.push({ date: weekday(y, m), amount: a, party: v[0], account: v[1], doc: 'INV-' + (seq++) });
      }
    }
    rows.sort(function (a, b) { return a.date - b.date; });
    // planted exceptions so every test has something to show
    var pickRow = function () { return rows[Math.floor(r() * rows.length)]; };
    for (var k = 0; k < 8; k++) {
      var s = pickRow(), d2 = new Date(s.date); d2.setDate(d2.getDate() + 1 + Math.floor(r() * 9));
      if (d2.getDay() === 6) d2.setDate(d2.getDate() + 2); if (d2.getDay() === 0) d2.setDate(d2.getDate() + 1);
      rows.push({ date: d2, amount: s.amount, party: s.party, account: s.account, doc: k < 3 ? s.doc : 'INV-' + (seq++) });
    }
    for (k = 0; k < 11; k++) {
      var w = pickRow(), d3 = new Date(w.date); d3.setDate(d3.getDate() + (6 - d3.getDay()) + (k % 2));
      rows.push({ date: d3, amount: r2(w.amount * (0.8 + r() * 0.4)), party: w.party, account: w.account, doc: 'INV-' + (seq++) });
    }
    var big = [V[3], V[8], V[12], V[1], V[11]];
    for (k = 0; k < 9; k++) {
      var b = big[k % big.length], d4 = pickRow().date;
      rows.push({ date: new Date(d4), amount: r2(9850 + r() * 145), party: b[0], account: b[1], doc: 'INV-' + (seq++) });
    }
    var rounds = [5000, 15000, 10000, 3000, 20000, 8000];
    for (k = 0; k < 6; k++) {
      var c = big[k % big.length];
      rows.push({ date: new Date(pickRow().date), amount: rounds[k], party: c[0], account: c[1], doc: 'INV-' + (seq++) });
    }
    var outl = [V[0], V[4], V[7], V[13]];
    for (k = 0; k < 4; k++) {
      rows.push({ date: new Date(pickRow().date), amount: r2(outl[k][2] * (19 + r() * 6)), party: outl[k][0], account: outl[k][1], doc: 'INV-' + (seq++) });
    }
    for (k = 0; k < 14; k++) {
      var cn = pickRow();
      rows.push({ date: new Date(cn.date), amount: -r2(cn.amount * (0.1 + r() * 0.3)), party: cn.party, account: cn.account, doc: 'CN-' + (seq++) });
    }
    rows.sort(function (a, b) { return a.date - b.date; });
    rows.forEach(function (x, i) { x.i = i; });
    return rows;
  }

  /* ---------- helpers ---------- */
  function ym(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function mean(a) { return a.reduce(function (s, x) { return s + x; }, 0) / (a.length || 1); }
  function sd(a) { var m = mean(a); return Math.sqrt(a.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / Math.max(1, a.length - 1)); }

  function profile(rows) {
    var dates = rows.filter(function (x) { return x.date; }).map(function (x) { return x.date; });
    var amts = rows.filter(function (x) { return x.amount != null; });
    var parties = {};
    rows.forEach(function (x) { if (x.party) parties[x.party] = 1; });
    return {
      n: rows.length,
      missDate: rows.length - dates.length,
      missAmount: rows.length - amts.length,
      missParty: rows.filter(function (x) { return !x.party; }).length,
      negatives: amts.filter(function (x) { return x.amount < 0; }).length,
      total: amts.reduce(function (s, x) { return s + x.amount; }, 0),
      gross: amts.reduce(function (s, x) { return s + Math.max(0, x.amount); }, 0),
      from: dates.length ? new Date(Math.min.apply(null, dates)) : null,
      to: dates.length ? new Date(Math.max.apply(null, dates)) : null,
      parties: Object.keys(parties).length
    };
  }

  /* ---------- audit tests ---------- */
  var BENF = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return Math.log10(1 + 1 / d); });
  function benford(rows) {
    var cnt = [0, 0, 0, 0, 0, 0, 0, 0, 0], n = 0;
    rows.forEach(function (x) {
      if (x.amount == null) return;
      var a = Math.abs(x.amount);
      if (a < 10) return;
      var d = +String(Math.floor(a)).charAt(0);
      cnt[d - 1]++; n++;
    });
    var obs = cnt.map(function (c) { return n ? c / n : 0; });
    var chi = 0, mad = 0;
    for (var k = 0; k < 9; k++) {
      var e = BENF[k] * n;
      if (e > 0) chi += (cnt[k] - e) * (cnt[k] - e) / e;
      mad += Math.abs(obs[k] - BENF[k]);
    }
    mad /= 9;
    var verdict = mad < 0.006 ? 'Στενή συμμόρφωση' : mad < 0.012 ? 'Αποδεκτή συμμόρφωση' : mad < 0.015 ? 'Οριακά αποδεκτή' : 'Μη συμμόρφωση';
    var level = mad < 0.012 ? 'good' : mad < 0.015 ? 'warn' : 'bad';
    return { n: n, counts: cnt, obs: obs, exp: BENF.slice(), chi: chi, chiCrit: 15.507, mad: mad, verdict: verdict, level: level };
  }

  function auditTests(rows, threshold) {
    var flags = {};
    function flag(row, test, note) {
      if (!flags[row.i]) flags[row.i] = { row: row, tests: {} };
      if (!flags[row.i].tests[test]) flags[row.i].tests[test] = note || true;
    }
    var pos = rows.filter(function (x) { return x.amount != null && x.amount > 0; });
    var res = { dup: { n: 0, value: 0, recover: 0 }, wkd: { n: 0, value: 0 }, thr: { n: 0, value: 0 }, rnd: { n: 0, value: 0 }, out: { n: 0, value: 0 } };

    // duplicates: same party and amount within 30 days, or same party and document number
    var g = {};
    pos.forEach(function (x) { var k = x.party + '|' + Math.round(x.amount * 100); (g[k] = g[k] || []).push(x); });
    var dupSeen = {};
    Object.keys(g).forEach(function (k) {
      var a = g[k]; if (a.length < 2) return;
      a.sort(function (p, q) { return (p.date || 0) - (q.date || 0); });
      for (var i = 1; i < a.length; i++) {
        if (!a[i].date || !a[i - 1].date) continue;
        var days = Math.round((a[i].date - a[i - 1].date) / 86400000);
        if (days <= 30) {
          flag(a[i - 1], 'dup', ['dupPair']);
          flag(a[i], 'dup', ['dupAfter', days, a[i - 1].doc || '#' + a[i - 1].i]);
          if (!dupSeen[a[i].i]) { dupSeen[a[i].i] = 1; res.dup.recover += a[i].amount; }
        }
      }
    });
    var gd = {};
    pos.forEach(function (x) { if (x.doc) { var k = x.party + '|' + x.doc; (gd[k] = gd[k] || []).push(x); } });
    Object.keys(gd).forEach(function (k) {
      var a = gd[k]; if (a.length < 2) return;
      a.forEach(function (x, j) {
        flag(x, 'dup', ['dupDoc']);
        if (j > 0 && !dupSeen[x.i]) { dupSeen[x.i] = 1; res.dup.recover += x.amount; }
      });
    });

    pos.forEach(function (x) {
      if (x.date && (x.date.getDay() === 0 || x.date.getDay() === 6)) flag(x, 'wkd', [x.date.getDay() === 0 ? 'sun' : 'sat']);
      if (threshold > 0 && x.amount >= threshold * 0.95 && x.amount < threshold) flag(x, 'thr', ['below', threshold - x.amount]);
      if (x.amount >= 1000 && Math.abs(x.amount - Math.round(x.amount / 1000) * 1000) < 0.005) flag(x, 'rnd', ['round']);
    });

    // outliers: log-amount z-score within each party (>= 8 payments), otherwise across the ledger
    var gp = {};
    pos.forEach(function (x) { (gp[x.party || '—'] = gp[x.party || '—'] || []).push(x); });
    var allLog = pos.map(function (x) { return Math.log(x.amount); });
    var gm = mean(allLog), gs = sd(allLog);
    Object.keys(gp).forEach(function (k) {
      var a = gp[k];
      var logs = a.map(function (x) { return Math.log(x.amount); });
      var m = a.length >= 8 ? mean(logs) : gm, s = a.length >= 8 ? sd(logs) : gs;
      if (!(s > 0)) return;
      a.forEach(function (x, j) {
        var z = (logs[j] - m) / s;
        if (z > 3) flag(x, 'out', ['z', z, x.amount / Math.exp(m)]);
      });
    });

    var list = Object.keys(flags).map(function (k) { return flags[k]; });
    list.forEach(function (f) {
      Object.keys(f.tests).forEach(function (t) { res[t].n++; res[t].value += f.row.amount; });
    });
    list.sort(function (a, b) { return Object.keys(b.tests).length - Object.keys(a.tests).length || b.row.amount - a.row.amount; });
    var value = list.reduce(function (s, f) { return s + f.row.amount; }, 0);
    return { tests: res, list: list, count: list.length, value: value, population: pos.length };
  }

  function concentration(rows) {
    var g = {}, tot = 0;
    rows.forEach(function (x) { if (x.amount > 0) { g[x.party || '—'] = (g[x.party || '—'] || 0) + x.amount; tot += x.amount; } });
    var a = Object.keys(g).map(function (k) { return { party: k, value: g[k], share: tot ? g[k] / tot : 0 }; });
    a.sort(function (p, q) { return q.value - p.value; });
    var top5 = a.slice(0, 5).reduce(function (s, x) { return s + x.share; }, 0);
    var hhi = a.reduce(function (s, x) { return s + Math.pow(x.share * 100, 2); }, 0);
    return { list: a, total: tot, top5: top5, hhi: hhi };
  }

  function monthly(rows) {
    var g = {};
    rows.forEach(function (x) { if (x.date && x.amount != null) { var k = ym(x.date); g[k] = (g[k] || 0) + x.amount; } });
    var keys = Object.keys(g).sort();
    if (!keys.length) return [];
    var out = [], p = keys[0].split('-'), y = +p[0], m = +p[1] - 1, last = keys[keys.length - 1];
    for (var guard = 0; guard < 600; guard++) {
      var k = y + '-' + String(m + 1).padStart(2, '0');
      out.push({ key: k, value: g[k] || 0 });
      if (k === last) break;
      m++; if (m > 11) { m = 0; y++; }
    }
    return out;
  }

  function forecast(series, h) {
    var n = series.length;
    if (n < 4) return null;
    var xs = series.map(function (_, i) { return i; }), ys = series.map(function (s) { return s.value; });
    var mx = mean(xs), my = mean(ys), sxx = 0, sxy = 0;
    for (var i = 0; i < n; i++) { sxx += (xs[i] - mx) * (xs[i] - mx); sxy += (xs[i] - mx) * (ys[i] - my); }
    var b = sxy / sxx, a = my - b * mx;
    var resid = ys.map(function (y, i) { return y - (a + b * i); });

<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };

/* ---------- language ---------- */
var LANG = 'el';

function t(k) {

var nf0, nf2;

}
setFormats();
function money(abs, sfxEl, sfxEn, neg) { return LANG === 'en' ? (neg ? '-' : '') + '€' + abs + sfxEn : (neg ? '-' : '') + abs + sfxEl + ' €'; }
var eur = function (v, d) { return money((d ? nf2 : nf0).format(Math.abs(v)), '', '', v < 0); };
var keur = function (v) {

  if (a >= 1e6) return money(nf2.format(a / 1e6), ' εκ.', 'm', n);

};
var decSep = function (s) { return LANG === 'en' ? s : s.replace('.', ','); };
var pct = function (v, d) { return isFinite(v) ? decSep((v * 100).toFixed(d == null ? 1 : d)) + '%' : '–'; };
var dec = function (v, d) { return isFinite(v) ? decSep(v.toFixed(d == null ? 2 : d)) : '–'; };
var signed = function (s, v) { return (v >= 0 ? '+' : '') + s; };
var mLabel = function (k) { var p = k.split('-'); return t('months')[+p[1] - 1] + ' ' + p[0].slice(2); };

function acct(a) { if (!S.sample || LANG !== 'en') return a; return I18N.en.acct[a] || a; }
function noteText(n) {

  var k = 'n_' + n[0];
  if (n[0] === 'below') return t(k, nf0.format(n[1]));
  if (n[0] === 'z') return t(k, dec(n[1], 1), nf0.format(n[2]));

}
function verdictKey(mad) { return mad < 0.006 ? 'vClose' : mad < 0.012 ? 'vAcc' : mad < 0.015 ? 'vMarg' : 'vNon'; }
function toast(msg) { var tt = document.createElement('div'); tt.className = 'toast'; tt.setAttribute('role', 'status'); tt.textContent = msg; document.body.appendChild(tt); setTimeout(function () { tt.remove(); }, 2400); }
function copyText(text, done) {

  var fallback = function () { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast(t('tManual')); } ta.remove(); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

/* ---------- state ---------- */
var STORE = 'ledgerlens:v1';
function sampleBudget() { var names = t('budNames'); return LL.SAMPLE_BUDGET.map(function (l, i) { return { name: names[i], type: l.type, b: l.b, a: l.a }; }); }
var S = { rows: LL.sampleLedger(), sample: true, matrix: null, headers: null, fin: JSON.parse(JSON.stringify(LL.SAMPLE_FIN)), budget: sampleBudget(), horizon: 6, filter: null, fileInfo: { k: 'sample' } };
$('#client').value = t('defClient'); $('#period').value = t('defPeriod');
try {
  var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved) {
    if (saved.fin) S.fin = saved.fin; if (saved.budget) S.budget = saved.budget;
    if (saved.client != null) $('#client').value = saved.client; if (saved.period != null) $('#period').value = saved.period;
    if (saved.thr != null) $('#thr').value = saved.thr;
  }
} catch (e) {}
(function () { var other = I18N[LANG === 'en' ? 'el' : 'en'].budNames, mine = t('budNames'); S.budget.forEach(function (l) { var i = other.indexOf(l.name); if (i > -1) l.name = mine[i]; }); })();
function persist() { try { localStorage.setItem(STORE, JSON.stringify({ fin: S.fin, budget: S.budget, client: $('#client').value, period: $('#period').value, thr: $('#thr').value })); } catch (e) {} }

var R = {};
function filled(v) { return v !== null && v !== undefined && v !== '' && isFinite(v); }
function compute() {
  var thr = parseFloat($('#thr').value) || 0;
  R.profile = LL.profile(S.rows);
  R.benford = LL.benford(S.rows);
  R.audit = LL.auditTests(S.rows, thr);
  R.conc = LL.concentration(S.rows);
  R.monthly = LL.monthly(S.rows);
  R.fc = LL.forecast(R.monthly, S.horizon);
  var finOk = LL.FIN_FIELDS.every(function (f) { return filled(S.fin.cy[f[0]]); });

  R.finOk = finOk;
  R.ratios = finOk ? LL.ratios(S.fin.cy, pyOk ? S.fin.py : null) : [];
  R.z = finOk ? LL.altman(S.fin.cy) : null;
  R.zPy = pyOk ? LL.altman(S.fin.py) : null;

/* ---------- charts ---------- */
var charts = {};
function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function chartTheme(light) {
  Chart.defaults.font.family = tok('--f-body') || 'sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = light ? '#5a6a63' : tok('--muted');
  Chart.defaults.borderColor = light ? '#dde5e2' : tok('--line');

}
function C(light) {
  return light ? { accent: '#17614f', soft: 'rgba(23,97,79,0.16)', good: '#1d7a4b', bad: '#b0352c', warn: '#a86b12', muted: '#8a9a93', ink: '#12201c', brass: '#8f6b1f' }
    : { accent: tok('--accent'), soft: tok('--accent-soft'), good: tok('--good'), bad: tok('--bad'), warn: tok('--warn'), muted: tok('--muted'), ink: tok('--ink'), brass: tok('--brass') };
}
function makeChart(id, cfg, light) {
  if (typeof Chart === 'undefined') return;
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  var el = document.getElementById(id); if (!el) return;
  chartTheme(light);
  charts[id] = new Chart(el, cfg);
  chartTheme(false);
}
var euroTick = function (v) { var a = Math.abs(v); return a >= 1e6 ? decSep((v / 1e6).toFixed(1)) + (LANG === 'en' ? 'm' : 'εκ') : a >= 1e3 ? nf0.format(v / 1e3) + (LANG === 'en' ? 'k' : 'χ') : nf0.format(v); };
var tipEur = function (ctx) { var v = ctx.raw; if (Array.isArray(v)) v = v[1] - v[0]; return (ctx.dataset.label ? ctx.dataset.label + ': ' : '') + eur(v); };

function bridgeCfg(c, light) {
  var labels = [t('bBudget')], data = [], colors = [], run = R.var.budgetProfit;
  data.push([0, run]); colors.push(c.muted);
  R.var.rows.forEach(function (r) { labels.push(r.name); data.push([run, run + r.impact]); colors.push(r.impact >= 0 ? c.good : c.bad); run += r.impact; });
  labels.push(t('bActual')); data.push([0, run]); colors.push(c.accent);
  return { type: 'bar', data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderRadius: 2, maxBarThickness: 46 }] },
    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { var v = ctx.raw; return (ctx.dataIndex === 0 || ctx.dataIndex === labels.length - 1) ? eur(v[1]) : signed(eur(v[1] - v[0]), v[1] - v[0]); } } } },
      scales: { y: { ticks: { callback: euroTick } }, x: { grid: { display: false }, ticks: { autoSkip: false, maxRotation: light ? 0 : 40, font: { size: light ? 10 : 11 } } } } } };
}
function benfordCfg(c) {
  return { type: 'bar', data: { labels: ['1', '2', '3', '4', '5', '6', '7', '8', '9'], datasets: [
    { type: 'line', label: t('benExp'), data: R.benford.exp, borderColor: c.brass, backgroundColor: c.brass, pointRadius: 3, borderWidth: 2, tension: 0.3, order: 0 },
    { label: t('benObs'), data: R.benford.obs, backgroundColor: c.accent, borderRadius: 2, order: 1 }] },
    options: { plugins: { tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + pct(ctx.raw); } } } }, scales: { y: { ticks: { callback: function (v) { return pct(v, 0); } } }, x: { grid: { display: false }, title: { display: true, text: t('firstDigit') } } } } };
}
function trendCfg(c) {
  var hist = R.monthly, fut = R.fc ? R.fc.future : [];
  var labels = hist.map(function (m) { return mLabel(m.key); }).concat(fut.map(function (f) { return mLabel(f.key); }));
  var pad = hist.map(function () { return null; });
  var lastH = hist.length ? hist[hist.length - 1].value : null;
  var fcLine = pad.slice(0, -1).concat([lastH]).concat(fut.map(function (f) { return f.value; }));

    { type: 'bar', label: t('dsActual'), data: hist.map(function (m) { return m.value; }).concat(fut.map(function () { return null; })), backgroundColor: c.accent, borderRadius: 2, order: 3 },
    { type: 'line', label: t('dsTrend'), data: R.fc ? R.fc.fitted.concat(fut.map(function () { return null; })) : [], borderColor: c.muted, borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, order: 2 },
    { type: 'line', label: '_lo', data: pad.concat(fut.map(function (f) { return Math.max(0, f.lo); })), borderWidth: 0, pointRadius: 0, order: 1 },
    { type: 'line', label: t('dsBand'), data: pad.concat(fut.map(function (f) { return f.hi; })), borderWidth: 0, pointRadius: 0, backgroundColor: c.soft, fill: '-1', order: 1 },
    { type: 'line', label: t('dsFc'), data: fcLine, borderColor: c.brass, backgroundColor: c.brass, borderWidth: 2.5, pointRadius: function (ctx) { return ctx.dataIndex >= hist.length ? 3 : 0; }, order: 0 }
  ];
  return { type: 'bar', data: { labels: labels, datasets: ds }, options: { interaction: { mode: 'index', intersect: false },
    plugins: { legend: { labels: { filter: function (i) { return i.text !== '_lo'; } } }, tooltip: { filter: function (i) { return i.raw != null && i.dataset.label !== '_lo'; }, callbacks: { label: tipEur } } },
    scales: { y: { beginAtZero: true, ticks: { callback: euroTick } }, x: { grid: { display: false } } } } };
}
function wcCfg(c, light) {
  var g = function (id) { return R.ratios.filter(function (r) { return r.id === id; })[0]; }, ids = ['dso', 'dio', 'dpo', 'ccc'];
  var labels = light ? ['DSO', 'DIO', 'DPO', t('cycle')] : [t('wcDSO'), t('wcDIO'), t('wcDPO'), t('wcCCC')];
  return { type: 'bar', data: { labels: labels, datasets: [
    { label: t('prevShort'), data: ids.map(function (i) { return g(i).py; }), backgroundColor: c.muted, borderRadius: 2 },
    { label: t('curShort'), data: ids.map(function (i) { return g(i).cy; }), backgroundColor: c.accent, borderRadius: 2 }] },
    options: light ? { plugins: { title: { display: true, text: t('wcTitle'), align: 'start', color: c.ink } }, scales: { x: { grid: { display: false } } } }
      : { indexAxis: 'y', plugins: { tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + nf0.format(ctx.raw) + ' ' + t('daysLong'); } } } }, scales: { x: { title: { display: true, text: t('axisDays') } }, y: { grid: { display: false } } } } };
}

/* ---------- render: data ---------- */
function statHtml(list) { return list.map(function (s) { return '<div class="stat ' + (s[3] ? 'flag-' + s[3] : '') + '"><div class="eyebrow">' + s[0] + '</div><div class="v">' + s[1] + '</div><div class="s">' + (s[2] || '') + '</div></div>'; }).join(''); }
function fileInfoText() { var f = S.fileInfo; return f.k === 'sample' ? t('fileSample') : f.k === 'read' ? t('fileRead', f.name, nf0.format(f.n), f.sheet) : t('fileApplied', f.name, nf0.format(f.n)); }
function renderData() {

  ]);
  var issues = [[t('dqDate'), p.missDate], [t('dqAmt'), p.missAmount], [t('dqParty'), p.missParty]];
  $('#dq').innerHTML = '<div class="tablewrap" style="border:0"><table><tbody>' + issues.map(function (i) {

  $('#preview').innerHTML = '<table><thead>' + head + '</thead><tbody>' + S.rows.slice(0, 12).map(function (r) {
    return '<tr><td class="mono">' + dfmt(r.date) + '</td><td>' + esc(r.party) + '</td><td>' + esc(acct(r.account)) + '</td><td class="mono">' + esc(r.doc) + '</td><td class="num">' + (r.amount == null ? '–' : nf2.format(r.amount)) + '</td></tr>';

/* ---------- render: financial ---------- */
function buildFinForm() {
  $('#finBody').innerHTML = LL.FIN_FIELDS.map(function (f) {
    var cy = S.fin.cy[f[0]], py = S.fin.py[f[0]], lab = t('f_' + f[0]);

  }).join('');
}
function fmtRatio(v, u) { return !isFinite(v) ? '–' : u === '%' ? pct(v) : u === 'd' ? nf0.format(v) + ' ' + t('daysShort') : dec(v) + 'x'; }
function renderFin() {
  $('#zt1').textContent = dec(1.1); $('#zt2').textContent = dec(2.6) + ' → ' + dec(5, 1) + '+';
  if (!R.finOk) { $('#ratioBody').innerHTML = '<tr><td colspan="6" class="muted">' + t('finIncomplete') + '</td></tr>'; $('#zVal').textContent = '–'; $('#zChip').innerHTML = ''; $('#zPrev').textContent = ''; if (charts.cWC) { charts.cWC.destroy(); delete charts.cWC; } return; }
  var grp = '', html = '';

  $('#zVal').textContent = dec(R.z.z);

}

/* ---------- render: budget ---------- */
function renderBud(rebuildTable) {

/* ---------- render: audit ---------- */
var TESTS = ['dup', 'thr', 'wkd', 'rnd', 'out'];
function renderAud() {
  var A = R.audit, B = R.benford, c = C();
  var rate = A.population ? A.count / A.population : 0;
  $('#audStats').innerHTML = statHtml([
    [t('aPop'), nf0.format(A.population), t('aPopS')],

/* ---------- board narrative ---------- */
function narrative() {
  var out = { findings: [], recs: [], kpis: [], level: 'good' };
  var sev = { good: 0, info: 0, warn: 1, bad: 2 }, worst = 0;
  function add(area, lv, text) { out.findings.push({ area: area, lv: lv, text: text }); worst = Math.max(worst, sev[lv] || 0); }
  var g = function (id) { return R.ratios.filter(function (r) { return r.id === id; })[0]; };
  if (R.finOk) {
    var fy = S.fin.cy, py = S.fin.py, growth = filled(py.rev) && py.rev ? fy.rev / py.rev - 1 : NaN;
    var nm = g('nm'), cur = g('cur'), dso = g('dso'), oq = g('ocfnp');
    out.kpis.push({ l: t('kRev'), v: keur(fy.rev), s: isFinite(growth) ? t('kRevS', signed(pct(growth), growth)) : '', lv: !isFinite(growth) || growth >= 0 ? 'good' : 'warn' });
    out.kpis.push({ l: t('kNm'), v: pct(nm.cy), s: isFinite(nm.py) ? t('prior', pct(nm.py)) : '', lv: nm.rag });
    out.kpis.push({ l: t('kZ'), v: dec(R.z.z), s: t('z' + R.z.zone), lv: R.z.zone });
    if (isFinite(growth)) add('res', growth >= 0 ? 'good' : 'warn', t('nRev', growth >= 0, pct(Math.abs(growth)), keur(fy.rev), pct(nm.cy), pct(nm.py)));
    if (isFinite(cur.py)) add('liq', cur.rag, t('nLiq', dec(cur.cy), dec(cur.py), fy.cash < py.cash, keur(fy.cash)));
    if (isFinite(dso.py) && dso.cy - dso.py > 3) {
      add('wc', dso.rag === 'good' ? 'warn' : dso.rag, t('nDso', nf0.format(dso.py), nf0.format(dso.cy), keur((dso.cy - dso.py) / 365 * fy.rev)));
      out.recs.push(t('rDso', nf0.format(dso.py)));
    }
    if (oq.cy < 1 && isFinite(oq.py)) { add('cash', oq.rag, t('nOcf', pct(oq.cy, 0), pct(oq.py, 0))); out.recs.push(t('rOcf')); }
    if (R.z.zone !== 'good') out.recs.push(t('rZ', dec(R.z.z)));
  }
  var V = R.var;
  if (V.rows.length) {
    var adverse = V.rows.filter(function (r) { return r.impact < 0; }).sort(function (a, b) { return a.impact - b.impact; }).slice(0, 2);
    var vl = V.diff >= 0 ? 'good' : Math.abs(V.pct) < 0.05 ? 'warn' : 'bad';
    out.kpis.push({ l: t('kBud'), v: signed(keur(V.diff), V.diff), s: t('kBudS', pct(V.pct), keur(V.actualProfit)), lv: vl });
    var drivers = adverse.map(function (a) { return a.name.toLowerCase() + ' (' + keur(a.impact) + ')'; }).join(' ' + t('and') + ' ');
    add('bud', vl, t('nBud', keur(V.actualProfit), V.diff >= 0, keur(Math.abs(V.diff)), pct(Math.abs(V.pct)), drivers));
    if (adverse.length && V.diff < 0) out.recs.push(t('rBud', adverse.map(function (a) { return a.name.toLowerCase(); }).join(' ' + t('and') + ' ')));
  }
  var A = R.audit, T = A.tests;
  if (A.population) {
    var rate = A.count / A.population, al = rate > 0.05 ? 'bad' : rate > 0.01 ? 'warn' : 'good';
    if (T.dup.n || T.thr.n) al = 'bad';
    out.kpis.push({ l: t('kAud'), v: nf0.format(A.count), s: t('kAudS', keur(A.value), nf0.format(A.population)), lv: al });
    add('aud', al, t('nAud', nf0.format(A.population), nf0.format(A.count), keur(A.value), nf0.format(T.dup.n), nf0.format(T.thr.n)));
    if (T.dup.recover > 0) out.recs.push(t('rDup', keur(T.dup.recover)));
    if (T.thr.n) out.recs.push(t('rThr', nf0.format(T.thr.n), eur(R.thr)));
    if (T.wkd.n) out.recs.push(t('rWkd', nf0.format(T.wkd.n)));
    add('ben', R.benford.level, t('nBen', t(verdictKey(R.benford.mad)), dec(R.benford.mad, 4)));
  }
  if (R.fc) {
    var fs = R.fc.future.reduce(function (s, f) { return s + f.value; }, 0);
    add('fc', 'info', t('nFc', R.monthly.length, S.horizon, keur(fs), keur(1.96 * R.fc.se)));
  }
  out.level = worst === 2 ? 'bad' : worst === 1 ? 'warn' : 'good';
  var client = $('#client').value || t('clientFallback');
  out.headline = t(out.level === 'good' ? 'headGood' : out.level === 'warn' ? 'headWarn' : 'headBad', client);
  if (!out.recs.length) out.recs.push(t('rDefault'));
  return out;
}

/* ---------- file loading ---------- */
function loadFile(file) {
  if (typeof XLSX === 'undefined') { toast(t('tLib')); return; }
  var isCsv = /\.(csv|txt)$/i.test(file.name);
  var rd = new FileReader();
  rd.onload = function (e) {
    try {
      var wb = isCsv ? XLSX.read(e.target.result, { type: 'string', raw: true }) : XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var m = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      var hIdx = 0; for (var i = 0; i < Math.min(10, m.length); i++) { if ((m[i] || []).filter(function (x) { return typeof x === 'string' && x.trim(); }).length >= 2) { hIdx = i; break; } }
      S.rawHeaders = (m[hIdx] || []).map(function (h) { return h == null || h === '' ? null : String(h); });
      S.matrix = m.slice(hIdx + 1);
      S.fileName = file.name;
      buildMapping(LL.detectColumns(S.rawHeaders.map(function (h) { return h || ''; })));
      S.fileInfo = { k: 'read', name: file.name, n: S.matrix.length, sheet: wb.SheetNames[0] };
      $('#fileInfo').textContent = fileInfoText();
    } catch (err) { toast(t('tReadFail')); }
  };
  if (isCsv) rd.readAsText(file); else rd.readAsArrayBuffer(file);
}

  if (e.key === 'Escape') closeDeck();

['client', 'period'].forEach(function (id) { $('#' + id).addEventListener('input', function () { persist(); if (current === 'board') renderBoard(); }); });
$('#thr').addEventListener('change', refresh);
$('#file').addEventListener('change', function (e) { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });
var drop = $('#drop');
['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
$('#resetSample').addEventListener('click', function (e) { e.preventDefault(); S.rows = LL.sampleLedger(); S.sample = true; S.filter = null; $('#mapPanel').hidden = true; S.fileInfo = { k: 'sample' }; refresh(); });
$('#applyMap').addEventListener('click', applyMapping);
$('#finBody').addEventListener('input', function (e) { var el = e.target; if (!el.dataset.k) return; var v = parseFloat(el.value); S.fin[el.dataset.y][el.dataset.k] = isFinite(v) ? v : null; compute(); renderFin(); persist(); });
$('#finSample').addEventListener('click', function () { S.fin = JSON.parse(JSON.stringify(LL.SAMPLE_FIN)); buildFinForm(); refresh(); });
$('#finClear').addEventListener('click', function () { S.fin = { cy: {}, py: {} }; buildFinForm(); refresh(); });
$('#budBody').addEventListener('input', function (e) {
  var el = e.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.f) return;
  var l = S.budget[+tr.dataset.i]; l[el.dataset.f] = (el.dataset.f === 'b' || el.dataset.f === 'a') ? (parseFloat(el.value) || 0) : el.value;
  compute(); renderBud(false); persist();
});
$('#budBody').addEventListener('change', function (e) { if (e.target.dataset.f === 'type') { compute(); renderBud(false); persist(); } });
$('#budBody').addEventListener('click', function (e) { var b = e.target.closest('[data-del]'); if (!b) return; S.budget.splice(+b.dataset.del, 1); compute(); renderBud(true); persist(); });
$('#budAdd').addEventListener('click', function () { S.budget.push({ name: t('newLine'), type: 'exp', b: 0, a: 0 }); compute(); renderBud(true); persist(); });
$('#budSample').addEventListener('click', function () { S.budget = sampleBudget(); compute(); renderBud(true); persist(); });
$('#tests').addEventListener('click', function (e) { var b = e.target.closest('.test'); if (!b) return; S.filter = S.filter === b.dataset.t ? null : b.dataset.t; document.querySelectorAll('.test').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.t === S.filter); }); renderExceptions(); });
$('#copyEx').addEventListener('click', function () {
  var lines = [[t('thDate'), t('thParty'), t('thAccount'), t('thDoc'), t('thAmountPlain'), t('thFindings')].join('\t')].concat(exList().map(function (f) { var r = f.row; return [dfmt(r.date), r.party, acct(r.account), r.doc, decSep(String(r.amount)), Object.keys(f.tests).map(function (k) { return t('t_' + k) + ' (' + noteText(f.tests[k]) + ')'; }).join('; ')].join('\t'); }));
  copyText(lines.join('\n'), t('tCopied', nf0.format(lines.length - 1)));
});
$('#copyReport').addEventListener('click', function () { copyText(reportText(), t('tReportCopied')); });
$('#horizon').addEventListener('change', function (e) { S.horizon = +e.target.value; refresh(); });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { RENDER[current](); }); } catch (e) {}
new MutationObserver(function () { RENDER[current](); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- boot ---------- */
applyStatic();
buildFinForm();
compute();
var startTab = 'data';
try { var h = (location.hash || '').slice(1); var st = localStorage.getItem(STORE + ':tab'); startTab = RENDER[h] ? h : RENDER[st] ? st : 'data'; } catch (e) {}
show(startTab);
window.__ll = { setLang: setLang, show: show, openDeck: openDeck, reportText: reportText, lang: function () { return LANG; } };
})();

</script>
